<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>Hiragana</title>

<style>
body{background:#0b0b0b;color:white;font-family:sans-serif;padding:20px;}
h1{color:gold;text-align:center;}

.grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
}

.box{
border:1px solid gold;
padding:10px;
text-align:center;
border-radius:10px;
}
</style>
</head>

<body>

<div class="grid">

<div class="box">え e</div>
<div class="box">お o</div>

<div class="box">か ka</div>

<div class="box">け ke</div>
<div class="box">こ ko</div>

<div class="box">さ sa</div>
<div class="box">し shi</div>

<div class="box">た ta</div>

<div class="box">つ tsu</div>

</html>
