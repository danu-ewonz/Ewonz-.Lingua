<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Ewonz Lingua</title>

<style>

/* FULL PAGE */
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:#000;
    overflow:hidden;
}

/* 3:4 MAIN CARD */
.card{
    width:300px;
    height:400px;

    border:3px solid gold;
    border-radius:20px;

    background:url("1780704324974.png") center/cover no-repeat;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:15px;
    box-sizing:border-box;
}

/* TITLE */
.title{
    font-size:28px;
    font-weight:bold;
    color:gold;
    margin-top:10px;
}

/* ABOUT */
.about{
    font-size:12px;
    color:white;
    text-align:center;
    margin-top:5px;
    padding:5px;
}

/* BUTTONS */
.buttons{
    margin-top:20px;
    width:100%;
    display:flex;
    flex-direction:column;
    gap:10px;
}

/* BTN */
.btn{
    padding:10px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    color:white;
    cursor:pointer;
}

/* COLORS */
.jp{background:#c0392b;}
.cn{background:#2980b9;}
.kr{background:#27ae60;}
.exam{background:linear-gradient(135deg,#d4af37,#8c6b00); color:black;}

</style>
</head>

<body>

<div class="card">

    <div class="title">EWONZ LINGUA</div>

    <div class="about">
        “Discover the world through language, connect globally, and grow beyond limits.”
    </div>

    <div class="buttons">

        <!-- Japanese Writing -->
        <button class="btn jp" onclick="location.href='words.html'">
            Japanese Language 🇯🇵
        </button>

        <!-- Korean -->
        <button class="btn kr">
            Korean Language 🇰🇷
        </button>

        <!-- Chinese -->
        <button class="btn cn">
            Chinese Language 🇨🇳
        </button>

        <!-- EXAM -->
        <button class="btn exam" onclick="location.href='exams.html'">
            Japanese Exams (Required Kanji)
        </button>

    </div>

</div>

</body>
</html>
