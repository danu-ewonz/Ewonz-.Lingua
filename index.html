<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Ewonz Lingua</title>

<style>

/* RESET */
body{
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family:Arial;
    background:#000;
}

/* FULL SCREEN BACKGROUND */
.bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;

    background:url("1780704324974.png") center/cover no-repeat;
    z-index:-1;
}

/* CENTER CONTENT */
.container{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

/* TITLE */
.title{
    font-size:32px;
    font-weight:bold;
    color:gold;
    text-shadow:2px 2px 5px black;
    margin-bottom:10px;
}

/* ABOUT TEXT */
.about{
    font-size:12px;
    color:white;
    text-align:center;
    padding:0 20px;
    margin-bottom:25px;
}

/* BUTTONS */
.buttons{
    display:flex;
    flex-direction:column;
    gap:12px;
    width:80%;
    max-width:350px;
}

/* BUTTON STYLE */
.btn{
    padding:15px;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    color:white;
}

/* COLORS */
.jp{background:#c0392b;}
.cn{background:#2980b9;}
.kr{background:#27ae60;}

</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="bg"></div>

<!-- CONTENT -->
<div class="container">

    <div class="title">EWONZ LINGUA</div>

    <div class="about">
        “Discover the world through language, connect globally, and grow beyond limits.”
    </div>

    <div class="buttons">

        <!-- 1 -->
        <button class="btn jp" onclick="location.href='words.html'">
            Japanese Language 🇯🇵
        </button>

        <!-- 2 -->
        <button class="btn cn">
            Chinese Language 🇨🇳
        </button>

        <!-- 3 -->
        <button class="btn kr">
            Korean Language 🇰🇷
        </button>

        <!-- ❌ 4th BUTTON REMOVED (Japanese Exams removed) -->

    </div>

</div>

</body>
</html>
