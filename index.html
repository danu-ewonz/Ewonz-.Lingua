<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Ewonz Lingua</title>

<style>

/* FULL SCREEN CENTER */
body{
    margin:0;
    height:100vh;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:Arial;
}

/* 3:4 FRAME */
.frame{
    width:320px;
    height:426px; /* 3:4 ratio */

    border:3px solid gold;
    border-radius:20px;

    position:relative;
    overflow:hidden;
}

/* BACKGROUND IMAGE INSIDE FRAME */
.frame::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;

    background:url("1780704324974.png") center/cover no-repeat;
    filter:brightness(0.7);
}

/* CONTENT OVER IMAGE */
.content{
    position:relative;
    z-index:1;

    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;
    padding:10px;
}

/* TITLE */
.title{
    font-size:28px;
    font-weight:bold;
    color:gold;
    text-shadow:2px 2px 5px black;
}

/* ABOUT */
.about{
    font-size:12px;
    color:white;
    margin:10px 0 20px 0;
    padding:0 10px;
}

/* BUTTONS */
.buttons{
    display:flex;
    flex-direction:column;
    gap:10px;
    width:90%;
}

/* BUTTON STYLE */
.btn{
    padding:12px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    color:white;
}

/* COLORS */
.jp{background:#c0392b;}
.cn{background:#2980b9;}
.kr{background:#27ae60;}

</style>
</head>

<body>

<div class="frame">

    <div class="content">

        <div class="title">EWONZ LINGUA</div>

        <div class="about">
            “Discover the world through language, connect globally, and grow beyond limits.”
        </div>

        <div class="buttons">

            <button class="btn jp" onclick="location.href='words.html'">
                Japanese Language 🇯🇵
            </button>

            <button class="btn cn">
                Chinese Language 🇨🇳
            </button>

            <button class="btn kr">
                Korean Language 🇰🇷
            </button>

        </div>

    </div>

</div>

</body>
</html>
