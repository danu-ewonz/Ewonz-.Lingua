<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Ewonz Lingua</title>

<style>

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family:Arial;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* GOLD OUTER FRAME */
.frame{
    width:90%;
    max-width:380px;
    height:85vh;

    border:3px solid gold;
    border-radius:20px;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:15px;
    box-sizing:border-box;

    background:#111;
}

/* BACKGROUND IMAGE BOX (SMALLER EFFECT) */
.bg{
    width:100%;
    height:45%;

    background:url("1780704324974.png") center/cover no-repeat;
    border-radius:15px;

    border:2px solid black; /* black border around image */
}

/* TITLE BOX */
.title-box{
    margin-top:10px;
    width:100%;

    text-align:center;

    border:2px solid black; /* black border around title */
    border-radius:10px;

    padding:8px;
}

.title{
    font-size:28px;
    font-weight:bold;
    color:gold;
}

/* ABOUT TEXT */
.about{
    margin-top:10px;
    font-size:12px;
    color:#ccc;
    text-align:center;
    padding:5px 10px;
}

/* BUTTONS */
.buttons{
    margin-top:15px;
    width:100%;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.btn{
    padding:12px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    color:white;
}

/* COLORS */
.jp{background:#c0392b;}
.cn{background:#2980b9;}
.kr{background:#27ae60;}

</style>
</head>

<body>

<div class="frame">

    <!-- IMAGE -->
    <div class="bg"></div>

    <!-- TITLE -->
    <div class="title-box">
        <div class="title">EWONZ LINGUA</div>
    </div>

    <!-- ABOUT -->
    <div class="about">
        “Discover the world through language, connect globally, and grow beyond limits.”
    </div>

    <!-- BUTTONS -->
    <div class="buttons">

        <button class="btn jp" onclick="location.href='words.html'">
            Japanese Language 🇯🇵
        </button>

        <button class="btn cn">
            Chinese Language 🇨🇳
        </button>

        <button class="btn kr">
            Korean Language 🇰🇷
        </button>

    </div>

</div>

</body>
</html>
