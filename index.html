<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>EWONZ LiNGUA</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">

<style>

/* FULL SCREEN */
body{
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* MAIN CARD */
.card{
    width:320px;
    height:430px;

    border:2px solid gold;
    border-radius:20px;

    background:url("1780704324974.png") center/cover no-repeat;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:10px;
    box-sizing:border-box;
}

/* TITLE */
.title{
    font-family:'Cinzel', serif;

    font-size:32px;
    font-weight:bold;

    color:gold;

    text-align:center;

    margin-top:5px;
    margin-bottom:10px;

    text-shadow:
    -2px -2px 0 #000,
     2px -2px 0 #000,
    -2px  2px 0 #000,
     2px  2px 0 #000,
     0px  0px 6px rgba(0,0,0,0.5);
}

/* ABOUT */
.about{
    font-size:12px;

    color:black;

    font-weight:600;

    text-align:center;

    padding:5px 15px;

    margin-top:15px;
    margin-bottom:60px;
}

/* BUTTON AREA */
.buttons{
    width:100%;

    display:flex;
    flex-direction:column;

    gap:12px;

    margin-top:20px;
}

/* BUTTON STYLE */
.btn{
    padding:12px;

    border:2px solid black;

    border-radius:12px;

    font-size:14px;
    font-weight:bold;

    background:rgba(255,255,255,0.25);

    color:black;

    backdrop-filter:blur(3px);
}

</style>
</head>

<body>

<div class="card">

    <div class="title">
        EWONZ LINGUA
    </div>

    <div class="about">
        Discover the world through language, connect globally, and grow beyond limits.
    </div>

    <div class="buttons">

        <button class="btn" onclick="location.href='words.html'">
            Japanese Language 🇯🇵
        </button>

        <button class="btn">
            Chinese Language 🇨🇳
        </button>

        <button class="btn">
            Korean Language 🇰🇷
        </button>

    </div>

</div>

</body>
</html>
