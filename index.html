<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Ewonz Lingua</title>

<style>

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family:Arial;
}

/* BACKGROUND */
.bg{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;

    background:url("1780704324974.png") center/cover no-repeat;
    z-index:-1;
}

/* MAIN LAYOUT */
.container{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

/* 🔥 TITLE UPDATED */
.title{
    font-size:44px;              /* BIGGER */
    font-weight:900;

    color:gold;

    /* BLACK BORDER EFFECT */
    text-shadow:
        -2px -2px 0 #000,
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000;

    margin-top:-60px;           /* MOVE UP */
    letter-spacing:2px;
}

/* ABOUT */
.about{
    font-size:12px;
    color:white;
    text-align:center;
    padding:10px 20px;
    margin-bottom:25px;
}

/* BUTTONS */
.buttons{
    display:flex;
    flex-direction:column;
    gap:12px;
    width:80%;
}

/* BUTTON STYLE */
.btn{
    padding:15px;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    color:white;
}

/* COLORS */
.jp{background:#c0392b;}
.cn{background:#2980b9;}
.kr{background:#27ae60;}

</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

    <div class="title">EWONZ LINGUA</div>

    <div class="about">
        “Discover the world through language, connect globally, and grow beyond limits.”
    </div>

    <div class="buttons">

        <button class="btn jp" onclick="location.href='words.html'">
            Japanese Language 🇯🇵
        </button>

        <button class="btn cn">
            Chinese Language 🇨🇳
        </button>

        <button class="btn kr">
            Korean Language 🇰🇷
        </button>

    </div>

</div>

</body>
</html>
