<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Ewonz Lingua</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* MAIN CARD */
.card{
    width:320px;
    height:430px;
    border:2px solid gold;
    border-radius:20px;
    background:url("1780704324974.png") center/cover no-repeat;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:10px;
    box-sizing:border-box;
    position:relative;
}

/* TITLE */
.title{
    font-family:'Playfair Display', serif;
    font-size:26px;
    font-weight:bold;
    color:gold;
    text-align:center;
    margin-top:5px;
    margin-bottom:10px;
}

/* ABOUT */
.about{
    font-size:12px;
    color:black;
    font-weight:600;
    text-align:center;
    padding:5px 15px;
    margin-top:40px;
    margin-bottom:20px;
}

/* BUTTONS */
.buttons{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.btn{
    padding:12px;
    border:2px solid gold;
    border-radius:12px;
    font-size:14px;
    font-weight:bold;
    background:rgba(255,255,255,0.20);
    color:black;
    backdrop-filter:blur(3px);
    transition:0.2s ease;
}

.btn:active{
    transform:scale(0.97);
    opacity:0.8;
}

/* SECTION TITLE */
.exam-title{
    margin-top:10px;
    font-size:14px;
    color:gold;
    font-weight:bold;
    text-align:center;
}

</style>
</head>

<body>

<div class="card">

    <div class="title">EWONZ LINGUA</div>

    <div class="about">
        Discover the world through language, connect globally, and grow beyond limits.
    </div>

    <div class="buttons">

        <!-- LANGUAGES -->
        <button class="btn" onclick="window.location.href='words.html'">
            Japanese Language 🇯🇵
        </button>

        <button class="btn" onclick="alert('Coming soon')">
            Chinese Language 🇨🇳
        </button>

        <button class="btn" onclick="alert('Coming soon')">
            Korean Language 🇰🇷
        </button>

        <!-- JLPT SECTION (ONLY ONE NOW) -->
        <div class="exam-title">Kanji Exams</div>

        <button class="btn" onclick="openExam('n5')">JLPT N5</button>
        <button class="btn" onclick="openExam('n4')">JLPT N4</button>

        <button class="btn" onclick="openSoon()">JLPT N3</button>
        <button class="btn" onclick="openSoon()">JLPT N2</button>
        <button class="btn" onclick="openSoon()">JLPT N1</button>

    </div>

</div>

<script>

function openExam(level){
    window.location.href = level + ".html";
}

function openSoon(){
    alert("🚧 Coming Soon - 2026.11.28 🚧");
}

</script>

</body>
</html>
