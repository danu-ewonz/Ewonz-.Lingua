<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Ewonz Lingua</title>

<style>

/* FULL SCREEN */
body{
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family:Arial;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* 3:4 CARD */
.card{
    width:320px;
    height:430px;

    border:2px solid gold;
    border-radius:20px;

    background:url("1780704324974.png") center/cover no-repeat;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:10px;
    box-sizing:border-box;
}

/* TITLE (SMALL + TOP) */
.title{
    font-size:22px;   /* smaller */
    font-weight:bold;
    color:gold;
    margin-top:5px;   /* move up */
    margin-bottom:5px;
    text-shadow:2px 2px 5px black;
}

/* ABOUT */
.about{
    font-size:11px;
    color:white;
    text-align:center;
    padding:5px 10px;
    margin-bottom:15px;
}

/* BUTTON AREA */
.buttons{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:10px;
}

/* BUTTON STYLE */
.btn{
    padding:12px;
    border:none;
    border-radius:12px;
    font-size:14px;
    font-weight:bold;
    color:white;
}

/* COLORS */
.jp{background:#c0392b;}
.cn{background:#2980b9;}
.kr{background:#27ae60;}

</style>
</head>

<body>

<div class="card">

    <!-- TITLE SMALL + TOP -->
    <div class="title">EWONZ LINGUA</div>

    <div class="about">
        “Discover the world through language, connect globally, and grow beyond limits.”
    </div>

    <div class="buttons">

        <button class="btn jp" onclick="location.href='words.html'">
            Japanese Language 🇯🇵
        </button>

        <button class="btn cn">
            Chinese Language 🇨🇳
        </button>

        <button class="btn kr">
            Korean Language 🇰🇷
        </button>

    </div>

</div>

</body>
</html>
