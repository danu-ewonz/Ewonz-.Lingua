<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Ewonz Lingua</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>

/* =========================
GLOBAL
========================= */
body{
    margin:0;
    min-height:100vh;
    background:#000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    font-family:Arial, sans-serif;
    padding:20px;
}

/* =========================
MAIN CARD
========================= */
.card{
    width:320px;
    height:430px;

    border:2px solid gold;
    border-radius:20px;

    background:url("1780704324974.png") center/cover no-repeat;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:10px;
    box-sizing:border-box;

    position:relative;
}

/* TITLE */
.title{
    font-family:'Playfair Display', serif;
    font-size:26px;
    font-weight:bold;
    color:gold;
    text-align:center;

    margin-top:5px;
    margin-bottom:10px;

    text-shadow:
    -1px -1px 0 #000,
     1px -1px 0 #000,
    -1px  1px 0 #000,
     1px  1px 0 #000;
}

/* ABOUT */
.about{
    font-size:12px;
    color:black;
    font-weight:600;

    text-align:center;

    padding:5px 15px;
    margin-top:40px;
    margin-bottom:40px;
}

/* BUTTONS */
.buttons{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
}

/* BUTTON */
.btn{
    padding:12px;

    border:2px solid gold;
    border-radius:12px;

    font-size:14px;
    font-weight:bold;

    background:rgba(255,255,255,0.20);
    color:black;

    backdrop-filter:blur(3px);
    transition:0.2s ease;

    position:relative;
}

.btn:active{
    transform:scale(0.97);
    opacity:0.8;
}

/* LOCKED */
.locked{
    opacity:0.6;
    pointer-events:none;
}

/* LOCK BADGE */
.badge{
    position:absolute;
    top:4px;
    right:8px;

    background:red;
    color:white;

    font-size:9px;
    font-weight:bold;

    padding:2px 6px;
    border-radius:5px;
}

/* =========================
CREDITS
========================= */
.info-box{
    width:320px;
    margin-top:15px;

    text-align:center;

    padding:10px;

    background:rgba(255,255,255,0.03);
    border-radius:12px;

    color:#aaa;
    font-size:12px;
    line-height:1.6;
}

.info-title{
    color:gold;
    font-size:13px;
    margin-bottom:6px;
}

.info-box a{
    color:gold;
    text-decoration:none;
}

</style>
</head>

<body>

<!-- CARD -->
<div class="card">

    <div class="title">EWONZ LINGUA</div>

    <div class="about">
        Discover the world through language, connect globally, and grow beyond limits.
    </div>

    <div class="buttons">

        <button class="btn" onclick="window.location.href='words.html'">
            Japanese Language 🇯🇵
        </button>

        <button class="btn locked" onclick="comingSoon()">
            Chinese Language 🇨🇳
            <span class="badge">LOCK</span>
        </button>

        <button class="btn locked" onclick="comingSoon()">
            Korean Language 🇰🇷
            <span class="badge">LOCK</span>
        </button>

    </div>
</div>

<!-- CREDITS -->
<div class="info-box">

    <div class="info-title">Credits</div>

    Created by <b>Danu Ewonz</b><br>

    WhatsApp:
    <a href="https://wa.me/94778730530">Contact</a><br><br>


</div>

<script>
function comingSoon(){
    alert("Coming Soon - 2026.11.28");
}
</script>

</body>
</html>
