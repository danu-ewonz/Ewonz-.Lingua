<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Chouon (ー) - Long Vowel</title>

<style>

body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#0b0b0b;
    font-family:Arial;
    padding:20px;
}

/* CARD */
.container{
    width:95%;
    max-width:500px;

    border:2px solid gold;
    border-radius:20px;

    padding:20px;
    text-align:center;

    background:rgba(255,255,255,0.03);
}

/* TITLE */
.title{
    color:gold;
    font-size:22px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    color:#aaa;
    font-size:13px;
    margin-bottom:20px;
}

/* BOX */
.box{
    border:2px solid gold;
    border-radius:12px;

    padding:12px;
    margin-bottom:12px;

    background:rgba(255,255,255,0.05);
}

/* BIG */
.big{
    font-size:26px;
    color:white;
    font-weight:bold;
}

/* SMALL */
.small{
    font-size:12px;
    color:#aaa;
    margin-top:5px;
}

/* SECTION */
.section{
    color:gold;
    font-size:14px;
    font-weight:bold;
    margin:15px 0 8px;
}

/* BACK BUTTON */
.back-btn{
    margin-top:20px;
    width:100%;
    padding:12px;

    border:2px solid gold;
    border-radius:12px;

    background:transparent;
    color:white;

    font-weight:bold;
}

.back-btn:active{
    transform:scale(0.97);
}

</style>
</head>

<body>

<div class="container">

    <div class="title">Chouon (ー)</div>
    <div class="subtitle">Long vowel sound extension</div>

    <div class="section">Basic Idea</div>
    <div class="box">
        <div class="big">ー = stretch sound</div>
        <div class="small">It makes vowel longer</div>
    </div>

    <div class="section">Examples</div>

    <div class="box">
        <div class="big">ラーメン</div>
        <div class="small">raamen (ramen)</div>
    </div>

    <div class="box">
        <div class="big">コーヒー</div>
        <div class="small">koohii (coffee)</div>
    </div>

    <div class="box">
        <div class="big">スーパーマーケット</div>
        <div class="small">suupaa maaketto (supermarket)</div>
    </div>

    <div class="box">
        <div class="big">タクシー</div>
        <div class="small">takushii (taxi)</div>
    </div>

    <button class="back-btn" onclick="window.location.href='words.html'">
        ← Back to Writing System
    </button>

</div>

</body>
</html>
