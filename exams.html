<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Japanese Exams</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0b0b0b;
    color:white;

    padding:20px;
    padding-bottom:80px;

    overflow-y:auto;
    overflow-x:hidden;

    touch-action:pan-y;
}

/* TITLE */
.title{
    text-align:center;
    font-size:24px;
    color:gold;
    font-weight:bold;
    margin-bottom:25px;

    text-shadow:0 0 10px rgba(255,215,0,0.3);
}

/* TREE BOX */
.tree{
    font-size:14px;
    line-height:1.8;

    border:2px solid gold;
    padding:15px;
    border-radius:12px;

    background:rgba(255,255,255,0.05);

    white-space:pre-line;
}

/* CLICKABLE ITEMS */
.exam-btn{
    display:block;
    width:100%;

    margin:6px 0;
    padding:10px;

    border:2px solid gold;
    border-radius:10px;

    background:rgba(255,255,255,0.08);
    color:white;

    font-weight:bold;
    text-align:left;

    transition:0.2s ease;
}

.exam-btn:active{
    transform:scale(0.97);
    background:rgba(255,215,0,0.15);
}

/* FLOAT NAV */
.bottom-nav{
    position:fixed;
    bottom:12px;
    right:12px;

    display:flex;
    gap:6px;
}

.nav-btn{
    width:42px;
    height:42px;

    border:none;
    border-radius:50%;

    font-weight:bold;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    box-shadow:0 0 10px rgba(255,215,0,0.25);
}

.nav-btn.back{
    background:#e74c3c;
    color:white;
}

.nav-btn.home{
    background:gold;
    color:black;
}

.note{
    font-size:12px;
    color:#aaa;
    margin-top:10px;
    text-align:center;
}

</style>
</head>

<body>

<div class="title">
🇯🇵 JAPANESE EXAMS
</div>

<!-- CLICKABLE SYSTEM -->
<div class="tree">

<button class="exam-btn">JLPT - N5</button>
<button class="exam-btn">JLPT - N4</button>
<button class="exam-btn">JLPT - N3</button>
<button class="exam-btn">JLPT - N2</button>
<button class="exam-btn">JLPT - N1</button>

<br>

<button class="exam-btn">NAT - 5Q</button>
<button class="exam-btn">NAT - 4Q</button>
<button class="exam-btn">NAT - 3Q</button>
<button class="exam-btn">NAT - 2Q</button>
<button class="exam-btn">NAT - 1Q</button>

<br>

<button class="exam-btn">JFT Basic (SSW)</button>

</div>

<div class="note">
Kanji (Japanese Exams System)
</div>

<!-- FLOAT NAV -->
<div class="bottom-nav">

    <button class="nav-btn back" onclick="history.back()">←</button>
    <button class="nav-btn home" onclick="location.href='index.html'">🏠</button>

</div>

</body>
</html>
