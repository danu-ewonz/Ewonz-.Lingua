<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Japanese Exams</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0b0b0b;
    color:white;
    padding:20px;
}

/* TITLE */
.title{
    text-align:center;
    font-size:24px;
    color:gold;
    font-weight:bold;
    margin-bottom:25px;
}

/* TREE STYLE BOX */
.tree{
    font-size:14px;
    line-height:1.8;

    white-space:pre-line;

    border:2px solid gold;
    padding:15px;
    border-radius:12px;

    background:rgba(255,255,255,0.05);
}

/* SMALL NOTE */
.note{
    font-size:12px;
    color:#aaa;
    margin-top:10px;
    text-align:center;
}

</style>
</head>

<body>

<div class="title">
🇯🇵 JAPANESE EXAMS
</div>

<div class="tree">
├── JLPT (Main System)
│   ├── N5
│   ├── N4
│   ├── N3
│   ├── N2
│   └── N1
│
├── NAT-TEST (Practice System)
│   ├── 5Q
│   ├── 4Q
│   ├── 3Q
│   ├── 2Q
│   └── 1Q
│
└── JFT-Basic (SSW Visa)
    └── Basic Level (N5–N4 Kanji)
</div>

<div class="note">
Kanji (Japanese Exams)
</div>

</body>
</html>
