<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connector Words</title>

<style>

body{
    margin:0;
    background:#0b0b0b;
    font-family:Arial;
    padding:20px;
    color:white;
}

.title{
    text-align:center;
    font-size:24px;
    color:gold;
    margin-bottom:20px;
}

/* ROW */
.row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

/* CARD */
.lang-card{
    flex:1;
    border:2px solid gold;
    border-radius:12px;
    padding:10px;
    background:rgba(255,255,255,0.05);
    text-align:center;
}

/* TEXT FIX */
.lang-card *{
    color:#ffffff;
}

/* JAPANESE */
.kanji{
    font-size:22px;
    font-weight:bold;
}

/* ROMAJI */
.romaji{
    color:#00ffcc;
    font-size:12px;
    margin-top:5px;
}

/* SINHALA */
.meaning{
    font-size:12px;
    margin-top:5px;
    color:#ffffff;
    opacity:0.9;
}

</style>
</head>

<body>

<div class="title">Connector Words</div>

<!-- 1 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">そして</div>
        <div class="romaji">soshite</div>
        <div class="meaning">සහ / ඊට පස්සේ</div>
    </div>

    <div class="lang-card">
        <div class="kanji">でも</div>
        <div class="romaji">demo</div>
        <div class="meaning">නමුත්</div>
    </div>

</div>

<!-- 2 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">だから</div>
        <div class="romaji">dakara</div>
        <div class="meaning">ඒ නිසා</div>
    </div>

    <div class="lang-card">
        <div class="kanji">それから</div>
        <div class="romaji">sorekara</div>
        <div class="meaning">ඊට පස්සේ</div>
    </div>

</div>

<!-- 3 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">または</div>
        <div class="romaji">matawa</div>
        <div class="meaning">හෝ</div>
    </div>

    <div class="lang-card">
        <div class="kanji">それで</div>
        <div class="romaji">sorede</div>
        <div class="meaning">ඒකෙන් / so</div>
    </div>

</div>

<!-- 4 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">しかし</div>
        <div class="romaji">shikashi</div>
        <div class="meaning">නමුත් (formal)</div>
    </div>

    <div class="lang-card">
        <div class="kanji">なぜなら</div>
        <div class="romaji">nazenara</div>
        <div class="meaning">ඒකට හේතුව</div>
    </div>

</div>

</body>
</html>
