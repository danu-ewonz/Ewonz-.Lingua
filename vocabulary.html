<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Basic Vocabulary</title>

<link rel="stylesheet" href="style.css">

<style>
/* safety fallback (if CSS not loaded) */
.container{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
}

.title{
    color:gold;
    font-size:26px;
    font-weight:bold;
    margin-bottom:25px;
    text-align:center;
}

.buttons{
    width:85%;
    display:flex;
    flex-direction:column;
    gap:15px;
}

.btn{
    padding:15px;
    border:3px solid gold;
    border-radius:15px;
    background:rgba(255,255,255,0.15);
    color:black;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

.btn:active{
    transform:scale(0.96);
    opacity:0.85;
}
</style>

</head>

<body>

<div class="container">

    <div class="title">Basic Vocabulary 📚</div>

    <div class="buttons">

        <button class="btn" onclick="go('pronounce-people.html')">
            Pronounce & People
        </button>

        <button class="btn" onclick="go('core-verbs.html')">
            Core Verbs
        </button>

        <button class="btn" onclick="go('essential-nouns.html')">
            Essential Nouns
        </button>

        <button class="btn" onclick="go('common-adjectives.html')">
            Common Adjectives
        </button>

        <button class="btn" onclick="go('question-words.html')">
            Question Words
        </button>

        <button class="btn" onclick="go('time-frequency.html')">
            Time & Frequency
        </button>

        <button class="btn" onclick="go('aisatsu-phrases.html')">
            Aisatsu & Phrases
        </button>

        <button class="btn" onclick="go('connectors.html')">
            Connectors
        </button>

    </div>

</div>

<script>
function go(page){
    window.location.href = page;
}
</script>

</body>
</html>
