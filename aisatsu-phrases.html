<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aisatsu & Phrases</title>

<style>

body{
    margin:0;
    background:#0b0b0b;
    font-family:Arial;
    padding:20px;
    color:white;
}

.title{
    text-align:center;
    font-size:24px;
    color:gold;
    margin-bottom:20px;
}

/* ROW */
.row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

/* CARD */
.lang-card{
    flex:1;
    border:2px solid gold;
    border-radius:12px;
    padding:10px;
    background:rgba(255,255,255,0.05);
    text-align:center;
}

/* TEXT FIX */
.lang-card *{
    color:#fff;
}

/* JAPANESE */
.kanji{
    font-size:22px;
    font-weight:bold;
}

/* ROMAJI */
.romaji{
    color:#00ffcc;
    font-size:12px;
    margin-top:5px;
}

/* SINHALA */
.meaning{
    font-size:12px;
    margin-top:5px;
    color:#ffffff;
    opacity:0.9;
}

</style>
</head>

<body>

<div class="title">Aisatsu & Phrases</div>

<!-- 1 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">こんにちは</div>
        <div class="romaji">konnichiwa</div>
        <div class="meaning">හෙලෝ / සුභ දවසක්</div>
    </div>

    <div class="lang-card">
        <div class="kanji">おはよう</div>
        <div class="romaji">ohayou</div>
        <div class="meaning">සුභ උදෑසනක්</div>
    </div>

</div>

<!-- 2 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">こんばんは</div>
        <div class="romaji">konbanwa</div>
        <div class="meaning">සුභ රාත්‍රියක්</div>
    </div>

    <div class="lang-card">
        <div class="kanji">ありがとう</div>
        <div class="romaji">arigatou</div>
        <div class="meaning">ස්තූතියි</div>
    </div>

</div>

<!-- 3 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">すみません</div>
        <div class="romaji">sumimasen</div>
        <div class="meaning">සමාවෙන්න / excuse me</div>
    </div>

    <div class="lang-card">
        <div class="kanji">さようなら</div>
        <div class="romaji">sayounara</div>
        <div class="meaning">ගිහින් එන්නම් / goodbye</div>
    </div>

</div>

<!-- 4 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">はい</div>
        <div class="romaji">hai</div>
        <div class="meaning">ඔව්</div>
    </div>

    <div class="lang-card">
        <div class="kanji">いいえ</div>
        <div class="romaji">iie</div>
        <div class="meaning">නැහැ</div>
    </div>

</div>

<!-- 5 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">お願いします</div>
        <div class="romaji">onegaishimasu</div>
        <div class="meaning">කරුණාකර / please</div>
    </div>

    <div class="lang-card">
        <div class="kanji">わかりました</div>
        <div class="romaji">wakarimashita</div>
        <div class="meaning">මට තේරුණා</div>
    </div>

</div>

</body>
</html>
