<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JLPT N4 Kanji</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="title">JLPT N4 Kanji</div>

<input id="searchBox" placeholder="Search Kanji..." />

<div class="container" id="list"></div>

<!-- DATA FILES -->
<script src="n4-data-1.js"></script>
<script src="n4-data-2.js"></script>
<script src="n4-data-3.js"></script>

<script>
let box = document.getElementById("list");

/* COMBINE ALL DATA */
let kanjiN4_all = [...kanjiN4_1, ...kanjiN4_2, ...kanjiN4_3];

/* RENDER */
function render(data){
    box.innerHTML = "";

    for(let i=0;i<data.length;i+=2){

        let k1 = data[i];
        let k2 = data[i+1];

        box.innerHTML += `
        <div class="row">

            <div class="card">
                <div class="kanji">${k1?.kanji || ""}</div>
                <div class="kana">${k1?.kana || ""}</div>
                <div class="romaji">${k1?.romaji || ""}</div>
                <div class="meaning">${k1?.meaning || ""}</div>
            </div>

            <div class="card">
                <div class="kanji">${k2?.kanji || ""}</div>
                <div class="kana">${k2?.kana || ""}</div>
                <div class="romaji">${k2?.romaji || ""}</div>
                <div class="meaning">${k2?.meaning || ""}</div>
            </div>

        </div>`;
    }
}

render(kanjiN4_all);

/* SEARCH */
document.getElementById("searchBox").addEventListener("keyup", function(){

let val = this.value.toLowerCase();

let filtered = kanjiN4_all.filter(k =>
    k.kanji.includes(val) ||
    k.kana.includes(val) ||
    k.romaji.toLowerCase().includes(val) ||
    k.meaning.includes(val)
);

render(filtered);

});
</script>

<!-- NAV -->
<div class="bottom-nav">
    <button class="nav-btn back" onclick="history.back()">←</button>
    <button class="nav-btn home" onclick="location.href='index.html'">🏠</button>
</div>

</body>
</html>
