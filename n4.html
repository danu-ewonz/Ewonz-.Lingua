<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT N4 Kanji</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0b0b0b;
    color:white;
    overflow-x:hidden;
}

.header{
    text-align:center;
    padding:20px;
    font-size:26px;
    font-weight:bold;
    color:#ffd700;
    letter-spacing:3px;
    border-bottom:2px solid #ffd700;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:12px;
    padding:15px;
}

.card{
    background:#111;
    border:2px solid #ffd700;
    border-radius:12px;
    padding:14px 10px;
    text-align:center;
    box-shadow:0 0 10px rgba(255,215,0,0.12);
    transition:0.2s;
}

.card:active{ transform:scale(0.96); }

.kanji{ font-size:42px; font-weight:bold; color:white; }
.en{ margin-top:6px; font-size:12px; color:white; }
.si{ margin-top:3px; font-size:13px; color:#ffd700; font-weight:bold; }
.hira{ margin-top:4px; font-size:12px; color:#ccc; }
.roma{ margin-top:2px; font-size:11px; color:#aaa; font-style:italic; }

.container{ padding-bottom:80px; }
</style>
</head>

<body>

<div class="header">JLPT - N4 KANJI</div>

<div class="container">
<div id="grid" class="grid"></div>
</div>

<script>
const kanjiList = [
    {k:"会", en:"Meet / Association", si:"හමුවීම", h:"かい", r:"kai"},
    {k:"同", en:"Same", si:"එකම", h:"どう", r:"dou"},
    {k:"事", en:"Thing / Matter", si:"දේ", h:"こと", r:"koto"},
    {k:"自", en:"Self", si:"තමා", h:"じ", r:"ji"},
    {k:"社", en:"Company", si:"සමාගම", h:"しゃ", r:"sha"},
    {k:"発", en:"Start", si:"ආරම්භය", h:"はつ", r:"hatsu"},
    {k:"者", en:"Person", si:"පුද්ගලයා", h:"しゃ", r:"sha"},
    {k:"地", en:"Earth", si:"පොළොව", h:"ち", r:"chi"},
    {k:"業", en:"Work", si:"වැඩ", h:"ぎょう", r:"gyou"},
    {k:"方", en:"Direction", si:"දිශාව", h:"ほう", r:"hou"},

    {k:"入", en:"Enter", si:"ඇතුල් වීම", h:"にゅう", r:"nyuu"},
    {k:"出", en:"Exit", si:"පිටවීම", h:"しゅつ", r:"shutsu"},
    {k:"時", en:"Time", si:"කාලය", h:"じ", r:"ji"},
    {k:"間", en:"Interval", si:"අතර", h:"かん", r:"kan"},
    {k:"行", en:"Go", si:"යනවා", h:"こう", r:"kou"},
    {k:"見", en:"See", si:"බලනවා", h:"けん", r:"ken"},
    {k:"知", en:"Know", si:"දන්නවා", h:"ち", r:"chi"},
    {k:"国", en:"Country", si:"රට", h:"こく", r:"koku"}
];

const grid=document.getElementById("grid");

kanjiList.forEach(i=>{
    const c=document.createElement("div");
    c.className="card";
    c.innerHTML=`
        <div class="kanji">${i.k}</div>
        <div class="en">${i.en}</div>
        <div class="si">${i.si}</div>
        <div class="hira">${i.h}</div>
        <div class="roma">${i.r}</div>
    `;
    grid.appendChild(c);
});
</script>

</body>
</html>
