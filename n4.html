<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT N4 Kanji</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0b0b0b;
    color:white;
    overflow-x:hidden;
}

/* HEADER */
.header{
    text-align:center;
    padding:20px;
    font-size:26px;
    font-weight:bold;
    color:#ffd700;
    letter-spacing:3px;
    border-bottom:2px solid #ffd700;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:12px;
    padding:15px;
}

/* CARD */
.card{
    background:#111;
    border:2px solid #ffd700;
    border-radius:12px;
    padding:16px 10px;
    text-align:center;
    box-shadow:0 0 10px rgba(255,215,0,0.15);
    transition:0.2s;
}

.card:active{
    transform:scale(0.96);
}

/* KANJI */
.kanji{
    font-size:42px;
    font-weight:bold;
}

/* TEXTS */
.en{
    margin-top:6px;
    font-size:12px;
    color:#ccc;
}

.si{
    margin-top:3px;
    font-size:13px;
    color:#ffcc66;
}

.reading{
    margin-top:4px;
    font-size:11px;
    color:#999;
}

.container{
    padding-bottom:80px;
}
</style>
</head>

<body>

<div class="header">JLPT - N4 KANJI</div>

<div class="container">
    <div id="grid" class="grid"></div>
</div>

<script>
const kanjiList = [
    {k:"会", en:"Meet / Association", si:"හමුවීම / සංගමය", r:"かい"},
    {k:"同", en:"Same", si:"එකම / සමාන", r:"どう"},
    {k:"事", en:"Thing / Matter", si:"දේ / කාරණය", r:"こと"},
    {k:"自", en:"Self", si:"තමා / ස්වයං", r:"じ"},
    {k:"社", en:"Company / Shrine", si:"සමාගම / දේවාලය", r:"しゃ"},
    {k:"発", en:"Start / Emit", si:"ආරම්භය / නිකුත් වීම", r:"はつ"},
    {k:"者", en:"Person", si:"පුද්ගලයා", r:"しゃ"},
    {k:"地", en:"Earth / Ground", si:"පොළොව", r:"ち"},
    {k:"業", en:"Business / Work", si:"ව්‍යාපාර / වැඩ", r:"ぎょう"},
    {k:"方", en:"Direction / Person", si:"දිශාව / පුද්ගලයා", r:"ほう"},

    {k:"入", en:"Enter", si:"ඇතුල් වීම", r:"にゅう"},
    {k:"出", en:"Exit", si:"පිටවීම", r:"しゅつ"},
    {k:"時", en:"Time", si:"කාලය", r:"じ"},
    {k:"間", en:"Interval", si:"අතර / කාල පරතරය", r:"かん"},
    {k:"行", en:"Go", si:"යනවා", r:"こう"},
    {k:"見", en:"See", si:"බලනවා", r:"けん"},
    {k:"月", en:"Moon / Month", si:"සඳ / මාසය", r:"げつ"},
    {k:"思", en:"Think", si:"සිතනවා", r:"おも"},
    {k:"知", en:"Know", si:"දන්නවා", r:"ち"},
    {k:"国", en:"Country", si:"රට", r:"こく"},
];

const grid = document.getElementById("grid");

kanjiList.forEach(item=>{
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
        <div class="kanji">${item.k}</div>
        <div class="en">${item.en}</div>
        <div class="si">${item.si}</div>
        <div class="reading">${item.r}</div>
    `;

    grid.appendChild(card);
});
</script>

</body>
</html>
