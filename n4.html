<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT N4 Kanji</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
}

.header{
  text-align:center;
  padding:18px;
  font-size:22px;
  color:#ffd700;
  border-bottom:2px solid #ffd700;
}

.search-box{
  padding:10px;
  text-align:center;
}

.search-box input{
  width:92%;
  padding:12px;
  border-radius:10px;
  border:2px solid #ffd700;
  background:#111;
  color:white;
  outline:none;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:15px;
}

.card{
  background:#111;
  border:2px solid #ffd700;
  border-radius:12px;
  padding:12px;
  text-align:center;
}

.kanji{font-size:40px;}
.en{font-size:12px;}
.si{color:#ffd700;font-size:13px;}
.hira{color:#ccc;font-size:12px;}
.roma{color:#aaa;font-size:11px;}
</style>
</head>

<body>

<div class="header">JLPT N4 KANJI</div>

<div class="search-box">
<input id="search" placeholder="Search kanji / English / Sinhala / Romaji...">
</div>

<div id="grid" class="grid"></div>

<!-- DATA FILES -->
<script src="n4-data-1.js"></script>
<script src="n4-data-2.js"></script>
<script src="n4-data-3.js"></script>

<script>
const grid = document.getElementById("grid");
const search = document.getElementById("search");

/* RENDER */
function render(list){
  grid.innerHTML = "";
  list.forEach(i=>{
    grid.innerHTML += `
      <div class="card">
        <div class="kanji">${i.k}</div>
        <div class="en">${i.en}</div>
        <div class="si">${i.si}</div>
        <div class="hira">${i.h}</div>
        <div class="roma">${i.r}</div>
      </div>
    `;
  });
}

/* INITIAL LOAD */
render(kanjiList);

/* SEARCH */
search.addEventListener("input",()=>{
  let v = search.value.toLowerCase();
  render(kanjiList.filter(i =>
    i.k.includes(v) ||
    i.en.toLowerCase().includes(v) ||
    i.si.includes(v) ||
    i.h.includes(v) ||
    i.r.toLowerCase().includes(v)
  ));
});
</script>

</body>
</html>
