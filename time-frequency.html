<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Time & Frequency</title>

<style>

body{
    margin:0;
    background:#0b0b0b;
    font-family:Arial;
    padding:20px;
    color:white;
}

.title{
    text-align:center;
    font-size:24px;
    color:gold;
    margin-bottom:20px;
}

/* ROW */
.row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

/* CARD */
.lang-card{
    flex:1;
    border:2px solid gold;
    border-radius:12px;
    padding:10px;
    background:rgba(255,255,255,0.05);
    text-align:center;
}

/* TEXT FIX */
.lang-card *{
    color:#fff;
}

/* JAPANESE */
.kanji{
    font-size:22px;
    font-weight:bold;
}

/* ROMAJI */
.romaji{
    color:#00ffcc;
    font-size:12px;
    margin-top:5px;
}

/* SINHALA */
.meaning{
    font-size:12px;
    margin-top:5px;
    color:#ffffff;
    opacity:0.9;
}

</style>
</head>

<body>

<div class="title">Time & Frequency</div>

<!-- 1 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">今日</div>
        <div class="romaji">kyou</div>
        <div class="meaning">අද</div>
    </div>

    <div class="lang-card">
        <div class="kanji">明日</div>
        <div class="romaji">ashita</div>
        <div class="meaning">හෙට</div>
    </div>

</div>

<!-- 2 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">昨日</div>
        <div class="romaji">kinou</div>
        <div class="meaning">ඊයේ</div>
    </div>

    <div class="lang-card">
        <div class="kanji">今</div>
        <div class="romaji">ima</div>
        <div class="meaning">දැන්</div>
    </div>

</div>

<!-- 3 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">毎日</div>
        <div class="romaji">mainichi</div>
        <div class="meaning">දිනපතා</div>
    </div>

    <div class="lang-card">
        <div class="kanji">毎週</div>
        <div class="romaji">maishuu</div>
        <div class="meaning">සතිපතා</div>
    </div>

</div>

<!-- 4 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">毎月</div>
        <div class="romaji">tsukizuki / maitsuki</div>
        <div class="meaning">මාසිකව</div>
    </div>

    <div class="lang-card">
        <div class="kanji">毎年</div>
        <div class="romaji">rainen / maitoshi</div>
        <div class="meaning">වාර්ෂිකව</div>
    </div>

</div>

<!-- 5 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">時々</div>
        <div class="romaji">tokidoki</div>
        <div class="meaning">ඉඳහිට</div>
    </div>

    <div class="lang-card">
        <div class="kanji">いつも</div>
        <div class="romaji">itsumo</div>
        <div class="meaning">හැමවිටම</div>
    </div>

</div>

</body>
</html>
