<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Japanese Exams</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0b0b0b;
    color:white;
    padding:20px;
}

/* MAIN TITLE */
.title{
    text-align:center;
    font-size:26px;
    font-weight:bold;
    color:gold;
    margin-bottom:20px;
}

/* SECTION BOX */
.section{
    border:2px solid gold;
    border-radius:15px;
    padding:15px;
    margin-bottom:15px;

    background:rgba(255,255,255,0.03);
}

/* SECTION HEAD */
.section h3{
    color:gold;
    margin-bottom:10px;
}

/* BUTTON STYLE */
.btn{
    width:100%;
    padding:12px;
    margin:6px 0;

    background:transparent;
    color:gold;

    border:2px solid gold;
    border-radius:10px;

    font-size:15px;
    font-weight:bold;

    transition:0.2s ease;
}

/* CLICK EFFECT */
.btn:active{
    transform:scale(0.97);
    opacity:0.8;
}

/* HOVER */
.btn:hover{
    box-shadow:0 0 8px gold;
}

</style>
</head>

<body>

<div class="title">
🇯🇵 JAPANESE EXAMS
</div>

<!-- 1 JLPT -->
<div class="section">
    <h3>JLPT (Main System)</h3>

    <button class="btn" onclick="location.href='n5.html'">N5</button>
    <button class="btn" onclick="location.href='n4.html'">N4</button>
    <button class="btn" onclick="location.href='n3.html'">N3</button>
    <button class="btn" onclick="location.href='n2.html'">N2</button>
    <button class="btn" onclick="location.href='n1.html'">N1</button>
</div>

<!-- 2 NAT -->
<div class="section">
    <h3>NAT-TEST (Practice System)</h3>

    <button class="btn">Q5</button>
    <button class="btn">Q4</button>
    <button class="btn">Q3</button>
    <button class="btn">Q2</button>
    <button class="btn">Q1</button>
</div>

<!-- 3 JFT -->
<div class="section">
    <h3>JFT-Basic (SSW Visa)</h3>

    <button class="btn" onclick="location.href='jft.html'">
        N2 (Basic Level)
    </button>
</div>

</body>
</html>
