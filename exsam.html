<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Japanese Exams</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0b0b0b;
    color:white;
    padding:20px;
}

/* TITLE */
.title{
    text-align:center;
    font-size:26px;
    font-weight:bold;
    color:gold;
    margin-bottom:20px;
}

/* SECTION */
.section{
    border:2px solid gold;
    border-radius:15px;
    padding:15px;
    margin-bottom:15px;
    background:rgba(255,255,255,0.03);
}

/* HEADING */
.section h3{
    color:gold;
    margin-bottom:10px;
}

/* BUTTON */
.btn{
    width:100%;
    padding:12px;
    margin:6px 0;

    background:transparent;
    color:gold;

    border:2px solid gold;
    border-radius:10px;

    font-size:15px;
    font-weight:bold;

    position:relative;
    cursor:pointer;
}

/* ACTIVE */
.btn:active{
    transform:scale(0.97);
}

/* HOVER */
.btn:hover{
    box-shadow:0 0 8px gold;
}

/* BADGE */
.badge{
    position:absolute;
    top:5px;
    right:6px;

    font-size:9px;
    padding:3px 5px;

    background:red;
    color:white;

    border-radius:6px;
    font-weight:bold;
}

/* 🔒 LOCK FIX */
.locked{
    opacity:0.6;
    pointer-events:none; /* 🚫 REAL BLOCK */
}

</style>
</head>

<body>

<div class="title">
🇯🇵 JAPANESE EXAMS
</div>

<!-- JLPT -->
<div class="section">
    <h3>JLPT (Main System)</h3>

    <!-- OPEN -->
    <button class="btn" onclick="location.href='n5.html'">N5</button>
    <button class="btn" onclick="location.href='n4.html'">N4</button>

    <!-- LOCKED -->
    <button class="btn locked">
        N3
        <span class="badge">Coming Soon - 2026.11.28</span>
    </button>

    <button class="btn locked">
        N2
        <span class="badge">Coming Soon - 2026.11.28</span>
    </button>

    <button class="btn locked">
        N1
        <span class="badge">Coming Soon - 2026.11.28</span>
    </button>

</div>

<!-- NAT -->
<div class="section">
    <h3>NAT-TEST (Practice System)</h3>

    <button class="btn locked">
        Q5
        <span class="badge">Coming Soon - 2026.11.28</span>
    </button>

    <button class="btn locked">
        Q4
        <span class="badge">Coming Soon - 2026.11.28</span>
    </button>

    <button class="btn locked">
        Q3
        <span class="badge">Coming Soon - 2026.11.28</span>
    </button>

    <button class="btn locked">
        Q2
        <span class="badge">Coming Soon - 2026.11.28</span>
    </button>

    <button class="btn locked">
        Q1
        <span class="badge">Coming Soon - 2026.11.28</span>
    </button>

</div>

<!-- JFT -->
<div class="section">
    <h3>JFT-Basic (SSW Visa)</h3>

    <button class="btn locked">
        N2 (Basic Level)
        <span class="badge">Coming Soon - 2026.11.28</span>
    </button>
</div>

</body>
</html>
