<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Japanese Exams</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0b0b0b;
    color:white;
    padding:20px;
}

.title{
    text-align:center;
    font-size:24px;
    color:gold;
    font-weight:bold;
    margin-bottom:25px;
}

.section{
    border:2px solid gold;
    border-radius:12px;
    padding:15px;
    background:rgba(255,255,255,0.05);
}

.exam-btn{
    width:100%;
    padding:12px;
    margin:6px 0;

    background:transparent;
    color:gold;

    border:1px solid gold;
    border-radius:10px;

    font-size:15px;
    font-weight:bold;
}

.exam-btn:active{
    transform:scale(0.98);
}

/* FLOAT NAV */
.bottom-nav{
    position:fixed;
    bottom:10px;
    right:10px;
    display:flex;
    gap:6px;
}

.nav-btn{
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    font-weight:bold;
}

.back{background:#e74c3c;color:white;}
.home{background:gold;color:black;}

</style>
</head>

<body>

<div class="title">🇯🇵 JAPANESE EXAMS</div>

<div class="section">

<h3>JLPT</h3>

<button class="exam-btn" onclick="window.location.href='n5.html'">N5</button>
<button class="exam-btn" onclick="window.location.href='n4.html'">N4</button>
<button class="exam-btn" onclick="window.location.href='n3.html'">N3</button>
<button class="exam-btn" onclick="window.location.href='n2.html'">N2</button>
<button class="exam-btn" onclick="window.location.href='n1.html'">N1</button>

</div>

<!-- NAV -->
<div class="bottom-nav">
    <button class="nav-btn back" onclick="history.back()">←</button>
    <button class="nav-btn home" onclick="window.location.href='index.html'">🏠</button>
</div>

</body>
</html>
