<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katakana Chouon</title>

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial;
padding:20px;
text-align:center;
}

h1{color:gold;}

.back-btn{
position:fixed;
top:15px;
left:15px;
padding:10px 14px;
border:1px solid gold;
background:rgba(255,215,0,0.1);
color:gold;
border-radius:10px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

td{
border:1px solid gold;
padding:15px;
font-size:20px;
}

.small{
font-size:12px;
opacity:0.7;
display:block;
}
</style>
</head>

<body>

<button class="back-btn" onclick="history.back()">⬅ Back</button>

<h1>Katakana Chouon</h1>

<table>

<tr>
<td>コーヒー<span class="small">kōhī</span></td>
</tr>

<tr>
<td>ケーキ<span class="small">kēki</span></td>
</tr>

<tr>
<td>スーパー<span class="small">sūpā</span></td>
</tr>

<tr>
<td>タクシー<span class="small">takushī</span></td>
</tr>

<tr>
<td>メール<span class="small">mēru</span></td>
</tr>

</table>

</body>
</html>
