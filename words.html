<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Japanese Writing System</title>

<style>

/* =========================
🌐 GLOBAL
========================= */
body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:radial-gradient(circle at top, #1a1a1a, #000);
    font-family:Arial;

    overflow-y:auto;
    padding:20px 0;
}

/* =========================
MAIN CARD
========================= */
.container{
    width:90%;
    max-width:400px;

    border:1px solid rgba(255,215,0,0.6);
    border-radius:20px;

    padding:20px;
    text-align:center;

    background:rgba(255,255,255,0.04);
    box-shadow:0 0 20px rgba(255,215,0,0.08);

    position:relative;
}

/* glow border (SAFE VERSION) */
.container::after{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:22px;

    background:linear-gradient(45deg,#ffd700,#ffcc00,#fff3b0,#ffae00);

    z-index:-1;
    filter:blur(6px);
    opacity:0.6;
}

/* =========================
TITLE
========================= */
.title{
    color:#ffd700;
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;

    text-shadow:0 0 8px rgba(255,215,0,0.3);
}

/* =========================
MAIN BUTTONS
========================= */
.btn{
    width:100%;
    padding:15px;
    margin:8px 0;

    border-radius:12px;
    border:1px solid rgba(255,215,0,0.6);

    font-size:16px;
    font-weight:bold;

    background:rgba(255,255,255,0.03);
    color:#fff;

    cursor:pointer;
    transition:0.25s ease;

    position:relative;
}

.btn:hover{
    transform:scale(1.03);
    background:rgba(255,215,0,0.9);
    color:#000;
    box-shadow:0 0 18px rgba(255,215,0,0.4);
}

/* fix text */
.hira,.kata,.kanji{
    color:#fff;
}

/* =========================
SPECIAL BOX
========================= */
.special-box{
    margin-top:25px;
    padding:15px;

    border-radius:15px;

    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,215,0,0.4);

    position:relative;
}

/* glow */
.special-box::after{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:17px;

    background:linear-gradient(45deg,#ffd700,#ffcc00,#fff3b0);

    filter:blur(6px);
    opacity:0.4;
    z-index:-1;
}

/* =========================
SPECIAL BUTTONS
========================= */
.special-btn{
    width:100%;
    padding:10px;

    margin:6px 0;

    border-radius:10px;
    border:1px solid rgba(255,215,0,0.4);

    background:rgba(255,255,255,0.04);
    color:#fff;

    font-size:13px;
    font-weight:bold;

    cursor:pointer;
    transition:0.25s ease;
}

.special-btn:hover{
    transform:scale(1.02);
    background:rgba(255,215,0,0.25);
    box-shadow:0 0 12px rgba(255,215,0,0.3);
}

</style>
</head>

<body>

<div class="container">

    <div class="title">
        Japanese Writing System 🇯🇵
    </div>

    <!-- MAIN BUTTONS -->
    <button class="btn hira" onclick="go('hiragana.html')">
        Hiragana あ
    </button>

    <button class="btn kata" onclick="go('katakana.html')">
        Katakana ア
    </button>

    <button class="btn kanji" onclick="go('kanji.html')">
        Kanji (漢字)
    </button>

    <!-- SPECIAL BOX -->
    <div class="special-box">

        <button class="special-btn" onclick="go('dakuten.html')">
            Dakuten (゛)
        </button>

        <button class="special-btn" onclick="go('handakuten.html')">
            Handakuten (゜)
        </button>

        <button class="special-btn" onclick="go('youon.html')">
            Youon (බැදි අක්ෂර)
        </button>

        <button class="special-btn" onclick="go('chouon.html')">
            Chouon (දිර්ඝ අක්ෂර)
        </button>

    </div>

</div>

<script>
function go(page){
    window.location.href = page;
}
</script>

</body>
</html>
