<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Japanese Writing System</title>

<style>

body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#0b0b0b;
    font-family:Arial;
    overflow-y:auto;
    padding:20px 0;
}

/* MAIN CARD */
.container{
    width:90%;
    max-width:400px;

    border:2px solid gold;
    border-radius:20px;

    padding:20px;
    text-align:center;

    background:rgba(255,255,255,0.03);
}

/* TITLE */
.title{
    color:gold;
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
}

/* BUTTONS */
.btn{
    width:100%;
    padding:15px;
    margin:8px 0;

    border:none;
    border-radius:12px;

    font-size:16px;
    font-weight:bold;

    color:white;
    cursor:pointer;
}

/* COLORS */
.hira{background:#c0392b;}
.kata{background:#2980b9;}
.kanji{background:linear-gradient(135deg,#d4af37,#8c6b00); color:black;}

/* =========================
🔴 SPECIAL CHARACTERS BOX (ADDED)
========================= */
.special-box{
    margin-top:25px;
    padding:15px;

    border:2px solid gold;
    border-radius:15px;

    background:rgba(255,255,255,0.05);
}

.special-title{
    font-size:14px;
    color:gold;
    font-weight:bold;
    margin-bottom:12px;
}

.special-btn{
    width:100%;
    padding:10px;

    margin:6px 0;

    border:1px solid gold;
    border-radius:10px;

    background:rgba(255,255,255,0.1);
    color:black;

    font-size:13px;
    font-weight:bold;
}

.special-btn:active{
    transform:scale(0.97);
}

</style>
</head>

<body>

<div class="container">

    <div class="title">
        Japanese Writing System 🇯🇵
    </div>

    <!-- HIRAGANA -->
    <button class="btn hira" onclick="go('hiragana.html')">
        Hiragana あ
    </button>

    <!-- KATAKANA -->
    <button class="btn kata" onclick="go('katakana.html')">
        Katakana ア
    </button>

    <!-- KANJI -->
    <button class="btn kanji" onclick="go('kanji.html')">
        Kanji (Required 漢字)
    </button>

    <!-- 🔥 SPECIAL CHARACTERS BOX -->
    <div class="special-box">

        <div class="special-title">
            Hiragana Special Characters
        </div>

        <button class="special-btn" onclick="go('dakuten.html')">
            Dakuten (゛)
        </button>

        <button class="special-btn" onclick="go('handakuten.html')">
            Handakuten (゜)
        </button>

        <button class="special-btn" onclick="go('youon.html')">
            Youon (ゃゅょ)
        </button>

        <button class="special-btn" onclick="go('chouon.html')">
            Chouon (ー)
        </button>

    </div>

</div>

<script>
function go(page){
    window.location.href = page;
}
</script>

</body>
</html>
