<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Japanese Language</title>

<style>

body{
    margin:0;
    background:#0b0b0b;
    color:white;
    font-family:Arial,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
}

.container{
    width:90%;
    max-width:450px;
}

.title{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    color:gold;
    margin-bottom:30px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.btn{
    padding:18px;
    border:none;
    border-radius:15px;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;
    color:white;
}

.hira{
    background:linear-gradient(135deg,#ff4d4d,#b30000);
}

.kata{
    background:linear-gradient(135deg,#4d79ff,#001f66);
}

</style>
</head>
<body>

<div class="container">

    <div class="title">
        🇯🇵 Japanese Language
    </div>

    <div class="menu">

        <button class="btn hira">
            あ Hiragana
        </button>

        <button class="btn kata">
            ア Katakana
        </button>

    </div>

</div>

</body>
</html>
