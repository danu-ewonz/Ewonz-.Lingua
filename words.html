<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Japanese Writing System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

<style>

/* =========================
   BODY
========================= */
body{
    margin:0;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#0b0b0b;
    font-family:'Poppins', sans-serif;
    overflow:hidden;
}

/* =========================
   CONTAINER
========================= */
.container{
    width:90%;
    max-width:450px;
}

/* =========================
   TITLE
========================= */
.title{
    text-align:center;
    font-size:22px;
    font-weight:700;
    color:gold;
    margin-bottom:30px;
    letter-spacing:1px;
}

/* =========================
   MENU
========================= */
.menu{
    display:flex;
    flex-direction:column;
    gap:15px;
    align-items:center;
}

/* =========================
   BUTTONS
========================= */
.btn{
    width:85%;
    padding:18px;

    border:none;
    border-radius:15px;

    font-size:18px;
    font-weight:700;

    color:white;
    cursor:pointer;

    transition:0.3s;
    box-shadow:0 5px 15px rgba(0,0,0,0.4);
}

.btn:hover{
    transform:scale(1.05);
}

/* HIRAGANA */
.hira{
    background:linear-gradient(135deg,#ff4d4d,#b30000);
}

/* KATAKANA */
.kata{
    background:linear-gradient(135deg,#4d79ff,#001f66);
}

</style>
</head>

<body>

<div class="container">

    <!-- TITLE -->
    <div class="title">
        Japanese Writing System 🇯🇵
    </div>

    <!-- MENU -->
    <div class="menu">

        <!-- 🔥 HIRAGANA LINK -->
        <button class="btn hira"
            onclick="window.location.href='hiragana.html'">
            あ Hiragana
        </button>

        <!-- 🔥 KATAKANA LINK -->
        <button class="btn kata"
            onclick="window.location.href='katakana.html'">
            ア Katakana
        </button>

    </div>

</div>

</body>
</html>
