<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hiragana Handakuten</title>

<style>
body{
margin:0;
background:#000;
font-family:Arial;
color:#fff;
padding:20px;
text-align:center;
}

h1{
color:gold;
margin-bottom:20px;
}

/* BOX */
.box{
border:2px solid gold;
border-radius:12px;
overflow:hidden;
text-align:left;
}

/* GROUP */
.group{
padding:12px 15px;
border-bottom:1px solid rgba(255,215,0,0.3);
}

.group:last-child{
border-bottom:none;
}

/* TITLE */
.title{
color:gold;
font-weight:bold;
font-size:16px;
margin-bottom:8px;
}

/* LINE */
.line{
font-size:18px;
line-height:1.8;
}

/* ROMAJI */
.small{
color:#ffd700;
font-size:14px;
}

</style>
</head>

<body>

<h1>Hiragana Handakuten</h1>

<div class="box">

<div class="group">
<div class="title">は行</div>
<div class="line">は → ぱ <span class="small">(ha → pa)</span></div>
<div class="line">ひ → ぴ <span class="small">(hi → pi)</span></div>
<div class="line">ふ → ぷ <span class="small">(fu → pu)</span></div>
<div class="line">へ → ぺ <span class="small">(he → pe)</span></div>
<div class="line">ほ → ぽ <span class="small">(ho → po)</span></div>
</div>

</div>

</body>
</html>
