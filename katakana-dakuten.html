<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katakana Chart</title>

<style>
body{
margin:0;
background:#000;
font-family:Arial;
color:#fff;
padding:20px;
text-align:center;
}

h1{
color:gold;
margin-bottom:20px;
}

/* TABLE STYLE */
table{
width:100%;
border-collapse:collapse;
border:2px solid gold;
border-radius:10px;
overflow:hidden;
}

/* CELLS */
td{
border:1px solid gold;
padding:15px;
font-size:22px;
}

/* ROMAJI */
.small{
display:block;
font-size:12px;
opacity:0.7;
margin-top:5px;
}

/* ROW HOVER */
tr:hover{
background:rgba(255,215,0,0.08);
}
</style>
</head>

<body>

<h1>Katakana Dakuten Chart</h1>

<table>

<tr>
<td>カ → ガ <span class="small">ka → ga</span></td>
<td>サ → ザ <span class="small">sa → za</span></td>
</tr>

<tr>
<td>タ → ダ <span class="small">ta → da</span></td>
<td>ハ → バ <span class="small">ha → ba</span></td>
</tr>

<tr>
<td>ハ → パ <span class="small">ha → pa</span></td>
<td>（Handakuten）<span class="small">semi voiced</span></td>
</tr>

<tr>
<td>ガ / ザ / ダ / バ <span class="small">voiced sounds</span></td>
<td>Japanese sound change rule</td>
</tr>

</table>

</body>
</html>
