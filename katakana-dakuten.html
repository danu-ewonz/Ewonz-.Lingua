<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katakana Dakuten Chart</title>

<style>
body{
margin:0;
background:#000;
font-family:Arial;
color:#fff;
padding:20px;
text-align:center;
}

h1{
color:gold;
margin-bottom:20px;
}

/* BOX */
.chart{
border:2px solid gold;
border-radius:12px;
overflow:hidden;
}

/* ROW */
.row{
padding:15px;
border-bottom:1px solid gold;
font-size:20px;
}

.row:last-child{
border-bottom:none;
}

/* ROMAJI */
.small{
display:block;
font-size:12px;
opacity:0.7;
margin-top:5px;
}

</style>
</head>

<body>

<h1>Katakana Conversion</h1>

<div class="chart">

<div class="row">
カ → ガ <span class="small">ka → ga</span>
</div>

<div class="row">
サ → ザ <span class="small">sa → za</span>
</div>

<div class="row">
タ → ダ <span class="small">ta → da</span>
</div>

<div class="row">
ハ → バ <span class="small">ha → ba</span>
</div>

</div>

</body>
</html>
