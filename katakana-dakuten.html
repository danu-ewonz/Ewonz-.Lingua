<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katakana Dakuten</title>

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial;
padding:20px;
text-align:center;
}

h1{color:gold;}

.back-btn{
position:fixed;
top:15px;
left:15px;
padding:10px 14px;
border:1px solid gold;
background:rgba(255,215,0,0.1);
color:gold;
border-radius:10px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

td{
border:1px solid gold;
padding:12px;
font-size:22px;
}

.small{
font-size:12px;
opacity:0.7;
display:block;
}
</style>
</head>

<body>

<button class="back-btn" onclick="history.back()">⬅ Back</button>

<h1>Katakana Dakuten</h1>

<table>
<tr>
<td>ガ<span class="small">ga</span></td>
<td>ギ<span class="small">gi</span></td>
<td>グ<span class="small">gu</span></td>
<td>ゲ<span class="small">ge</span></td>
<td>ゴ<span class="small">go</span></td>
</tr>

<tr>
<td>ザ<span class="small">za</span></td>
<td>ジ<span class="small">ji</span></td>
<td>ズ<span class="small">zu</span></td>
<td>ゼ<span class="small">ze</span></td>
<td>ゾ<span class="small">zo</span></td>
</tr>

<tr>
<td>ダ<span class="small">da</span></td>
<td>ヂ<span class="small">ji</span></td>
<td>ヅ<span class="small">zu</span></td>
<td>デ<span class="small">de</span></td>
<td>ド<span class="small">do</span></td>
</tr>

<tr>
<td>バ<span class="small">ba</span></td>
<td>ビ<span class="small">bi</span></td>
<td>ブ<span class="small">bu</span></td>
<td>ベ<span class="small">be</span></td>
<td>ボ<span class="small">bo</span></td>
</tr>
</table>

</body>
</html>
