<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katakana Dakuten</title>

<style>
body{
margin:0;
background:#000;
font-family:Arial;
color:#fff;
padding:20px;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:95%;
max-width:500px;
border:2px solid gold;
border-radius:20px;
padding:20px;
background:rgba(255,255,255,0.03);
}

.title{
text-align:center;
color:gold;
font-size:22px;
font-weight:bold;
margin-bottom:20px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

/* CARD */
.card{
border:2px solid gold;
border-radius:12px;
padding:12px;
background:rgba(255,255,255,0.05);
text-align:center;
}

/* JAPANESE LINE */
.jp{
font-size:22px;
font-weight:bold;
color:white;
}

/* ROMAJI LINE */
.rm{
font-size:13px;
color:#aaa;
margin-top:5px;
}

/* RESPONSIVE */
@media(max-width:500px){
.grid{
grid-template-columns:1fr 1fr;
}
}

</style>
</head>

<body>

<div class="container">

<div class="title">Katakana Dakuten</div>

<div class="grid">

<div class="card">
<div class="jp">カ → ガ</div>
<div class="rm">Ka → Ga</div>
</div>

<div class="card">
<div class="jp">キ → ギ</div>
<div class="rm">Ki → Gi</div>
</div>

<div class="card">
<div class="jp">ク → グ</div>
<div class="rm">Ku → Gu</div>
</div>

<div class="card">
<div class="jp">ケ → ゲ</div>
<div class="rm">Ke → Ge</div>
</div>

<div class="card">
<div class="jp">コ → ゴ</div>
<div class="rm">Ko → Go</div>
</div>

<div class="card">
<div class="jp">サ → ザ</div>
<div class="rm">Sa → Za</div>
</div>

<div class="card">
<div class="jp">シ → ジ</div>
<div class="rm">Shi → Ji</div>
</div>

<div class="card">
<div class="jp">ス → ズ</div>
<div class="rm">Su → Zu</div>
</div>

<div class="card">
<div class="jp">セ → ゼ</div>
<div class="rm">Se → Ze</div>
</div>

<div class="card">
<div class="jp">ソ → ゾ</div>
<div class="rm">So → Zo</div>
</div>

<div class="card">
<div class="jp">タ → ダ</div>
<div class="rm">Ta → Da</div>
</div>

<div class="card">
<div class="jp">チ → ヂ</div>
<div class="rm">Chi → Ji</div>
</div>

<div class="card">
<div class="jp">ツ → ヅ</div>
<div class="rm">Tsu → Zu</div>
</div>

<div class="card">
<div class="jp">テ → デ</div>
<div class="rm">Te → De</div>
</div>

<div class="card">
<div class="jp">ト → ド</div>
<div class="rm">To → Do</div>
</div>

<div class="card">
<div class="jp">ハ → バ</div>
<div class="rm">Ha → Ba</div>
</div>

<div class="card">
<div class="jp">ヒ → ビ</div>
<div class="rm">Hi → Bi</div>
</div>

<div class="card">
<div class="jp">フ → ブ</div>
<div class="rm">Fu → Bu</div>
</div>

<div class="card">
<div class="jp">ヘ → ベ</div>
<div class="rm">He → Be</div>
</div>

<div class="card">
<div class="jp">ホ → ボ</div>
<div class="rm">Ho → Bo</div>
</div>

</div>

</div>

</body>
</html>
