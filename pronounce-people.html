<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pronounce & People</title>

<link rel="stylesheet" href="style.css">

<style>
/* extra small tweak (optional) */
.btn{
    text-align:left;
    line-height:1.6;
}
.small{
    font-size:12px;
    opacity:0.8;
}
</style>

</head>

<body>

<div class="container">

    <div class="title">Pronounce & People 👤</div>

    <div class="buttons">

        <div class="btn">
            私 (わたし - watashi) <br>
            <span class="small">මම / I</span>
        </div>

        <div class="btn">
            あなた (anata) <br>
            <span class="small">ඔබ / You</span>
        </div>

        <div class="btn">
            彼 (かれ - kare) <br>
            <span class="small">ඔහු / He</span>
        </div>

        <div class="btn">
            彼女 (かのじょ - kanojo) <br>
            <span class="small">ඇය / She</span>
        </div>

        <div class="btn">
            私たち (わたしたち - watashitachi) <br>
            <span class="small">අපි / We</span>
        </div>

        <div class="btn">
            先生 (せんせい - sensei) <br>
            <span class="small">ගුරුතුමා / Teacher</span>
        </div>

        <div class="btn">
            学生 (がくせい - gakusei) <br>
            <span class="small">ශිෂ්‍යයා / Student</span>
        </div>

        <div class="btn">
            友達 (ともだち - tomodachi) <br>
            <span class="small">මිතුරා / Friend</span>
        </div>

    </div>

</div>

</body>
</html>
