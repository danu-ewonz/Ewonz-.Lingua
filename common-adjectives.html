<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Essential Nouns</title>

<style>

body{
    margin:0;
    background:#0b0b0b;
    font-family:Arial;
    padding:20px;
    color:white;
}

.title{
    text-align:center;
    font-size:24px;
    color:gold;
    margin-bottom:20px;
}

/* ROW */
.row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

/* CARD */
.lang-card{
    flex:1;
    border:2px solid gold;
    border-radius:12px;
    padding:10px;
    background:rgba(255,255,255,0.05);
    text-align:center;
}

/* TEXT FIX */
.lang-card *{
    color:#fff;
}

/* JAPANESE */
.kanji{
    font-size:26px;
    font-weight:bold;
}

/* ROMAJI */
.romaji{
    color:#00ffcc;
    font-size:12px;
    margin-top:5px;
}

/* SINHALA */
.meaning{
    font-size:12px;
    margin-top:5px;
    color:#ffffff;
    opacity:0.9;
}

</style>
</head>

<body>

<div class="title">Essential Nouns</div>

<!-- 1 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">水</div>
        <div class="romaji">mizu</div>
        <div class="meaning">වතුර</div>
    </div>

    <div class="lang-card">
        <div class="kanji">ご飯</div>
        <div class="romaji">gohan</div>
        <div class="meaning">ආහාර / බත්</div>
    </div>

</div>

<!-- 2 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">学校</div>
        <div class="romaji">gakkou</div>
        <div class="meaning">පාසල</div>
    </div>

    <div class="lang-card">
        <div class="kanji">家</div>
        <div class="romaji">ie</div>
        <div class="meaning">නිවස</div>
    </div>

</div>

<!-- 3 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">車</div>
        <div class="romaji">kuruma</div>
        <div class="meaning">කාර් / වාහන</div>
    </div>

    <div class="lang-card">
        <div class="kanji">本</div>
        <div class="romaji">hon</div>
        <div class="meaning">පොත</div>
    </div>

</div>

<!-- 4 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">人</div>
        <div class="romaji">hito</div>
        <div class="meaning">පුද්ගලයා</div>
    </div>

    <div class="lang-card">
        <div class="kanji">友達</div>
        <div class="romaji">tomodachi</div>
        <div class="meaning">මිතුරා</div>
    </div>

</div>

<!-- 5 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">時間</div>
        <div class="romaji">jikan</div>
        <div class="meaning">කාලය</div>
    </div>

    <div class="lang-card">
        <div class="kanji">仕事</div>
        <div class="romaji">shigoto</div>
        <div class="meaning">රැකියාව</div>
    </div>

</div>

</body>
</html>
