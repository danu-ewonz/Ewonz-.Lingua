<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Common Adjectives</title>

<style>

body{
    margin:0;
    background:#0b0b0b;
    font-family:Arial;
    padding:20px;
    color:white;
}

.title{
    text-align:center;
    font-size:24px;
    color:gold;
    margin-bottom:20px;
}

/* ROW */
.row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

/* CARD */
.lang-card{
    flex:1;
    border:2px solid gold;
    border-radius:12px;
    padding:10px;
    background:rgba(255,255,255,0.05);
    text-align:center;
}

/* TEXT FIX */
.lang-card *{
    color:#fff;
}

/* JAPANESE */
.kanji{
    font-size:24px;
    font-weight:bold;
}

/* ROMAJI */
.romaji{
    color:#00ffcc;
    font-size:12px;
    margin-top:5px;
}

/* SINHALA */
.meaning{
    font-size:12px;
    margin-top:5px;
    color:#ffffff;
    opacity:0.9;
}

</style>
</head>

<body>

<div class="title">Common Adjectives</div>

<!-- 1 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">大きい</div>
        <div class="romaji">ookii</div>
        <div class="meaning">විශාල</div>
    </div>

    <div class="lang-card">
        <div class="kanji">小さい</div>
        <div class="romaji">chiisai</div>
        <div class="meaning">කුඩා</div>
    </div>

</div>

<!-- 2 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">高い</div>
        <div class="romaji">takai</div>
        <div class="meaning">උස / මිල අධික</div>
    </div>

    <div class="lang-card">
        <div class="kanji">安い</div>
        <div class="romaji">yasui</div>
        <div class="meaning">ලාභ / අඩු මිල</div>
    </div>

</div>

<!-- 3 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">新しい</div>
        <div class="romaji">atarashii</div>
        <div class="meaning">අලුත්</div>
    </div>

    <div class="lang-card">
        <div class="kanji">古い</div>
        <div class="romaji">furui</div>
        <div class="meaning">පැරණි</div>
    </div>

</div>

<!-- 4 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">良い</div>
        <div class="romaji">ii / yoi</div>
        <div class="meaning">හොඳ</div>
    </div>

    <div class="lang-card">
        <div class="kanji">悪い</div>
        <div class="romaji">warui</div>
        <div class="meaning">නරක</div>
    </div>

</div>

<!-- 5 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">暑い</div>
        <div class="romaji">atsui</div>
        <div class="meaning">උණුසුම් (කාලගුණය)</div>
    </div>

    <div class="lang-card">
        <div class="kanji">寒い</div>
        <div class="romaji">samui</div>
        <div class="meaning">සීතල</div>
    </div>

</div>

</body>
</html>
