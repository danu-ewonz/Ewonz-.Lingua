<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hiragana Dakuten</title>

<style>
body{
margin:0;
background:#000;
font-family:Arial;
color:#fff;
padding:20px;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:95%;
max-width:500px;
border:2px solid gold;
border-radius:20px;
padding:20px;
background:rgba(255,255,255,0.03);
}

.title{
text-align:center;
color:gold;
font-size:22px;
font-weight:bold;
margin-bottom:20px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

/* CARD */
.card{
border:2px solid gold;
border-radius:12px;
padding:12px;
background:rgba(255,255,255,0.05);
text-align:center;
}

/* JAPANESE */
.jp{
font-size:22px;
font-weight:bold;
color:white;
}

/* ROMAJI */
.rm{
font-size:13px;
color:#aaa;
margin-top:5px;
}

</style>
</head>

<body>

<div class="container">

<div class="title">Hiragana Dakuten</div>

<div class="grid">

<div class="card">
<div class="jp">か → が</div>
<div class="rm">Ka → Ga</div>
</div>

<div class="card">
<div class="jp">き → ぎ</div>
<div class="rm">Ki → Gi</div>
</div>

<div class="card">
<div class="jp">く → ぐ</div>
<div class="rm">Ku → Gu</div>
</div>

<div class="card">
<div class="jp">け → げ</div>
<div class="rm">Ke → Ge</div>
</div>

<div class="card">
<div class="jp">こ → ご</div>
<div class="rm">Ko → Go</div>
</div>

<div class="card">
<div class="jp">さ → ざ</div>
<div class="rm">Sa → Za</div>
</div>

<div class="card">
<div class="jp">し → じ</div>
<div class="rm">Shi → Ji</div>
</div>

<div class="card">
<div class="jp">す → ず</div>
<div class="rm">Su → Zu</div>
</div>

<div class="card">
<div class="jp">せ → ぜ</div>
<div class="rm">Se → Ze</div>
</div>

<div class="card">
<div class="jp">そ → ぞ</div>
<div class="rm">So → Zo</div>
</div>

<div class="card">
<div class="jp">た → だ</div>
<div class="rm">Ta → Da</div>
</div>

<div class="card">
<div class="jp">ち → ぢ</div>
<div class="rm">Chi → Ji</div>
</div>

<div class="card">
<div class="jp">つ → づ</div>
<div class="rm">Tsu → Zu</div>
</div>

<div class="card">
<div class="jp">て → で</div>
<div class="rm">Te → De</div>
</div>

<div class="card">
<div class="jp">と → ど</div>
<div class="rm">To → Do</div>
</div>

<div class="card">
<div class="jp">は → ば</div>
<div class="rm">Ha → Ba</div>
</div>

<div class="card">
<div class="jp">ひ → び</div>
<div class="rm">Hi → Bi</div>
</div>

<div class="card">
<div class="jp">ふ → ぶ</div>
<div class="rm">Fu → Bu</div>
</div>

<div class="card">
<div class="jp">へ → べ</div>
<div class="rm">He → Be</div>
</div>

<div class="card">
<div class="jp">ほ → ぼ</div>
<div class="rm">Ho → Bo</div>
</div>

</div>

</div>

</body>
</html>
