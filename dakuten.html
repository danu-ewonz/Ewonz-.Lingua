<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Hiragana Dakuten</title>

<style>

body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#0b0b0b;
    font-family:Arial;
    padding:20px;
}

/* CONTAINER */
.container{
    width:95%;
    max-width:500px;

    border:2px solid gold;
    border-radius:20px;

    padding:20px;
    text-align:center;

    background:rgba(255,255,255,0.03);
}

/* TITLE */
.title{
    color:gold;
    font-size:22px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    color:#aaa;
    font-size:13px;
    margin-bottom:20px;
}

/* SECTION */
.section{
    color:gold;
    font-size:14px;
    font-weight:bold;
    margin:18px 0 10px;
}

/* ROW */
.row{
    display:flex;
    gap:10px;
    margin-bottom:12px;
}

/* BOX */
.box{
    flex:1;

    border:2px solid gold;
    border-radius:12px;

    padding:12px;

    background:rgba(255,255,255,0.05);
}

/* BIG */
.big{
    font-size:26px;
    color:white;
    font-weight:bold;
}

/* SMALL */
.small{
    font-size:12px;
    color:#aaa;
    margin-top:5px;
}

</style>
</head>

<body>

<div class="container">

    <div class="title">Hiragana Dakuten</div>
    <div class="subtitle">Voiced sound conversion system</div>

    <!-- 🔥 K GROUP -->
    <div class="section">K-group</div>

    <div class="row">
        <div class="box"><div class="big">か</div><div class="small">ka → ga</div></div>
        <div class="box"><div class="big">き</div><div class="small">ki → gi</div></div>
        <div class="box"><div class="big">く</div><div class="small">ku → gu</div></div>
    </div>

    <div class="row">
        <div class="box"><div class="big">け</div><div class="small">ke → ge</div></div>
        <div class="box"><div class="big">こ</div><div class="small">ko → go</div></div>
    </div>

    <!-- 🔥 S GROUP -->
    <div class="section">S-group</div>

    <div class="row">
        <div class="box"><div class="big">さ</div><div class="small">sa → za</div></div>
        <div class="box"><div class="big">し</div><div class="small">shi → ji</div></div>
        <div class="box"><div class="big">す</div><div class="small">su → zu</div></div>
    </div>

    <div class="row">
        <div class="box"><div class="big">せ</div><div class="small">se → ze</div></div>
        <div class="box"><div class="big">そ</div><div class="small">so → zo</div></div>
    </div>

    <!-- 🔥 T GROUP -->
    <div class="section">T-group</div>

    <div class="row">
        <div class="box"><div class="big">た</div><div class="small">ta → da</div></div>
        <div class="box"><div class="big">ち</div><div class="small">chi → ji</div></div>
        <div class="box"><div class="big">つ</div><div class="small">tsu → zu</div></div>
    </div>

    <div class="row">
        <div class="box"><div class="big">て</div><div class="small">te → de</div></div>
        <div class="box"><div class="big">と</div><div class="small">to → do</div></div>
    </div>

    <!-- 🔥 H GROUP -->
    <div class="section">H-group</div>

    <div class="row">
        <div class="box"><div class="big">は</div><div class="small">ha → ba</div></div>
        <div class="box"><div class="big">ひ</div><div class="small">hi → bi</div></div>
        <div class="box"><div class="big">ふ</div><div class="small">fu → bu</div></div>
    </div>

    <div class="row">
        <div class="box"><div class="big">へ</div><div class="small">he → be</div></div>
        <div class="box"><div class="big">ほ</div><div class="small">ho → bo</div></div>
    </div>

</div>

</body>
</html>
