<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT N5 Kanji</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0b0b0b;
    color:white;
    overflow-x:hidden;
}

/* HEADER */
.header{
    text-align:center;
    padding:20px;
    font-size:26px;
    font-weight:bold;
    color:#ffd700;
    letter-spacing:3px;
    border-bottom:2px solid #ffd700;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:12px;
    padding:15px;
}

/* CARD */
.card{
    background:#111;
    border:2px solid #ffd700;
    border-radius:12px;
    padding:16px 10px;
    text-align:center;
    box-shadow:0 0 10px rgba(255,215,0,0.12);
    transition:0.2s;
}

.card:active{
    transform:scale(0.96);
}

/* KANJI */
.kanji{
    font-size:42px;
    font-weight:bold;
    color:white;
}

/* ENGLISH */
.en{
    margin-top:6px;
    font-size:12px;
    color:white;
}

/* SINHALA (GOLD HIGHLIGHT) */
.si{
    margin-top:3px;
    font-size:13px;
    color:#ffd700;
    font-weight:bold;
}

/* READING */
.reading{
    margin-top:4px;
    font-size:11px;
    color:white;
}

.container{
    padding-bottom:80px;
}
</style>
</head>

<body>

<div class="header">JLPT - N5 KANJI</div>

<div class="container">
    <div id="grid" class="grid"></div>
</div>

<script>
const kanjiList = [
    {k:"一", en:"One", si:"එක", r:"いち"},
    {k:"二", en:"Two", si:"දෙක", r:"に"},
    {k:"三", en:"Three", si:"තුන", r:"さん"},
    {k:"四", en:"Four", si:"හතර", r:"よん"},
    {k:"五", en:"Five", si:"පහ", r:"ご"},
    {k:"六", en:"Six", si:"හය", r:"ろく"},
    {k:"七", en:"Seven", si:"හත", r:"なな"},
    {k:"八", en:"Eight", si:"අට", r:"はち"},
    {k:"九", en:"Nine", si:"නවය", r:"きゅう"},
    {k:"十", en:"Ten", si:"දහය", r:"じゅう"},

    {k:"日", en:"Sun / Day", si:"සූර්යයා / දිනය", r:"にち"},
    {k:"月", en:"Moon / Month", si:"සඳ / මාසය", r:"げつ"},
    {k:"火", en:"Fire", si:"ගිනි", r:"か"},
    {k:"水", en:"Water", si:"ජලය", r:"すい"},
    {k:"木", en:"Tree", si:"ගස", r:"もく"},
    {k:"金", en:"Gold / Money", si:"රත්‍රන් / මුදල්", r:"きん"},
    {k:"土", en:"Earth", si:"පොළොව", r:"ど"},

    {k:"人", en:"Person", si:"පුද්ගලයා", r:"ひと"},
    {k:"口", en:"Mouth", si:"මුඛය", r:"くち"},
    {k:"目", en:"Eye", si:"ඇස", r:"め"},
];

const grid = document.getElementById("grid");

kanjiList.forEach(item=>{
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
        <div class="kanji">${item.k}</div>
        <div class="en">${item.en}</div>
        <div class="si">${item.si}</div>
        <div class="reading">${item.r}</div>
    `;

    grid.appendChild(card);
});
</script>

</body>
</html>
