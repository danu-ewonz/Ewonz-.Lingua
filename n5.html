<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N5 Kanji</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b0b0b;
    color:white;
}

.header{
    text-align:center;
    padding:18px;
    color:#ffd700;
    border-bottom:2px solid #ffd700;
    font-size:22px;
}

.search-box{
    padding:10px;
}

.search-box input{
    width:92%;
    padding:12px;
    border:2px solid #ffd700;
    background:#111;
    color:white;
    border-radius:10px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:15px;
}

.card{
    background:#111;
    border:2px solid #ffd700;
    border-radius:12px;
    text-align:center;
    padding:12px;
}

.kanji{font-size:40px;}
.en{font-size:12px;}
.si{color:#ffd700;font-size:13px;}
.hira{color:#ccc;font-size:12px;}
.roma{color:#aaa;font-size:11px;}
</style>
</head>

<body>

<div class="header">JLPT N5 KANJI</div>

<div class="search-box">
<input id="search" placeholder="Search...">
</div>

<div id="grid" class="grid"></div>

<script>

const kanjiList = [
{ k:"一", en:"One", si:"එක", h:"いち", r:"ichi" },
{ k:"二", en:"Two", si:"දෙක", h:"に", r:"ni" },
{ k:"三", en:"Three", si:"තුන", h:"さん", r:"san" },
{ k:"四", en:"Four", si:"හතර", h:"よん", r:"yon" },
{ k:"五", en:"Five", si:"පහ", h:"ご", r:"go" },
{ k:"六", en:"Six", si:"හය", h:"ろく", r:"roku" },
{ k:"七", en:"Seven", si:"හත", h:"なな", r:"nana" },
{ k:"八", en:"Eight", si:"අට", h:"はち", r:"hachi" },
{ k:"九", en:"Nine", si:"නවය", h:"きゅう", r:"kyuu" },
{ k:"十", en:"Ten", si:"දහය", h:"じゅう", r:"juu" }
];

const grid = document.getElementById("grid");
const search = document.getElementById("search");

function render(list){
grid.innerHTML="";
list.forEach(i=>{
grid.innerHTML += `
<div class="card">
<div class="kanji">${i.k}</div>
<div class="en">${i.en}</div>
<div class="si">${i.si}</div>
<div class="hira">${i.h}</div>
<div class="roma">${i.r}</div>
</div>`;
});
}

render(kanjiList);

search.addEventListener("input",()=>{
let v = search.value.toLowerCase();
render(kanjiList.filter(i=>
i.k.includes(v)||
i.en.toLowerCase().includes(v)||
i.si.includes(v)||
i.h.includes(v)||
i.r.includes(v)
));
});

</script>

</body>
</html>
