<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JLPT N5 Kanji</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0b0b0b;
    color:white;
    padding:15px;
}

/* TITLE */
.title{
    text-align:center;
    font-size:24px;
    color:gold;
    font-weight:bold;
    margin-bottom:15px;
}

/* TABLE CONTAINER */
.table{
    width:100%;
}

/* ROW */
.row{
    display:flex;
    justify-content:space-between;
    align-items:center;

    border:2px solid gold;
    border-radius:10px;

    padding:10px;
    margin-bottom:8px;

    background:rgba(255,255,255,0.05);
}

/* KANJI */
.kanji{
    font-size:26px;
    color:gold;
    font-weight:bold;
    width:25%;
    text-align:center;
}

/* PRONOUNCE */
.pronounce{
    font-size:12px;
    color:#aaa;
    width:35%;
    text-align:center;
}

/* MEANING */
.meaning{
    font-size:13px;
    color:white;
    width:40%;
    text-align:center;
}

</style>
</head>

<body>

<div class="title">
JLPT N5 KANJI
</div>

<div class="table">

    <div class="row">
        <div class="kanji">日</div>
        <div class="pronounce">にち / ひ</div>
        <div class="meaning">දවස / සූර්යයා</div>
    </div>

    <div class="row">
        <div class="kanji">月</div>
        <div class="pronounce">げつ / つき</div>
        <div class="meaning">මාසය / චන්ද්‍රයා</div>
    </div>

    <div class="row">
        <div class="kanji">人</div>
        <div class="pronounce">ひと / じん</div>
        <div class="meaning">මිනිසා</div>
    </div>

    <div class="row">
        <div class="kanji">山</div>
        <div class="pronounce">やま</div>
        <div class="meaning">කන්ද</div>
    </div>

    <div class="row">
        <div class="kanji">川</div>
        <div class="pronounce">かわ</div>
        <div class="meaning">ගඟ</div>
    </div>

    <div class="row">
        <div class="kanji">水</div>
        <div class="pronounce">みず</div>
        <div class="meaning">වතුර</div>
    </div>

    <div class="row">
        <div class="kanji">火</div>
        <div class="pronounce">ひ</div>
        <div class="meaning">ගිනි</div>
    </div>

    <div class="row">
        <div class="kanji">木</div>
        <div class="pronounce">き</div>
        <div class="meaning">ගස</div>
    </div>

</div>

</body>
</html>
