<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>N5 Kanji 120</title>

<style>

body{
background:#0b0b0b;
color:white;
font-family:Arial;
padding:15px;
touch-action:none;
}

.row{
border:2px solid gold;
border-radius:10px;
padding:12px;
margin:10px 0;
background:rgba(255,255,255,0.05);
text-align:center;
}

.kanji{font-size:32px;color:gold;font-weight:bold;}
.kana{font-size:12px;color:#aaa;margin-top:3px;}
.romaji{font-size:13px;color:#00ffcc;margin-top:5px;}
.meaning{font-size:13px;color:white;margin-top:5px;}

</style>
</head>

<body>

<h2 style="text-align:center;color:gold;">JLPT N5 KANJI (120 FULL SYSTEM)</h2>

<div id="list"></div>

<script src="n5-data.js"></script>

<script>

let box=document.getElementById("list");

kanjiN5.forEach(k=>{
box.innerHTML += `
<div class="row">

<div class="kanji">${k.kanji}</div>
<div class="kana">${k.kana}</div>
<div class="romaji">${k.romaji}</div>
<div class="meaning">${k.meaning}</div>

</div>`;
});

console.log("FINAL COUNT =", kanjiN5.length);

</script>

</body>
</html>
