<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>N5 Kanji 2 Column</title>

<style>

/* GLOBAL FIX */
html, body{
    margin:0;
    padding:0;
    background:#0b0b0b;
    font-family:Arial, sans-serif;
    color:white;

    overflow-y:auto;
    overflow-x:hidden;
    touch-action:pan-y;
}

/* TITLE */
.title{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    color:gold;
    padding:15px;
}

/* SEARCH */
#searchBox{
    width:90%;
    display:block;
    margin:10px auto;
    padding:10px;

    border:2px solid gold;
    border-radius:10px;

    background:#111;
    color:white;
}

/* LIST WRAPPER */
.container{
    padding:10px;
}

/* ROW (2 ITEMS) */
.row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

/* CARD */
.card{
    flex:1;
    border:2px solid gold;
    border-radius:12px;

    padding:10px;
    background:rgba(255,255,255,0.05);

    text-align:center;
}

/* KANJI */
.kanji{
    font-size:30px;
    color:gold;
    font-weight:bold;
}

/* HIRAGANA */
.kana{
    font-size:11px;
    color:#aaa;
    margin-top:3px;
}

/* ROMAJI */
.romaji{
    font-size:12px;
    color:#00ffcc;
    margin-top:5px;
}

/* SINHALA */
.meaning{
    font-size:12px;
    color:white;
    margin-top:5px;
}

</style>
</head>

<body>

<div class="title">JLPT N5 Kanji (2 Column List)</div>

<input id="searchBox" placeholder="Search Kanji..." />

<div class="container" id="list"></div>

<script src="n5-data.js"></script>

<script>

let box = document.getElementById("list");

/* 2 COLUMN RENDER */
for(let i=0; i<kanjiN5.length; i+=2){

let k1 = kanjiN5[i];
let k2 = kanjiN5[i+1];

box.innerHTML += `
<div class="row">

<div class="card">
<div class="kanji">${k1?.kanji || ""}</div>
<div class="kana">${k1?.kana || ""}</div>
<div class="romaji">${k1?.romaji || ""}</div>
<div class="meaning">${k1?.meaning || ""}</div>
</div>

<div class="card">
<div class="kanji">${k2?.kanji || ""}</div>
<div class="kana">${k2?.kana || ""}</div>
<div class="romaji">${k2?.romaji || ""}</div>
<div class="meaning">${k2?.meaning || ""}</div>
</div>

</div>`;
}

/* SEARCH */
document.getElementById("searchBox").addEventListener("keyup", function(){

let value = this.value.toLowerCase();
let cards = document.querySelectorAll(".card");

cards.forEach(card=>{
    let text = card.innerText.toLowerCase();

    if(text.includes(value)){
        card.style.display="block";
    } else {
        card.style.display="none";
    }
});

});

</script>

</body>
</html>
