<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>N5 Kanji 120</title>

<style>
body{
background:#0b0b0b;
color:white;
font-family:Arial;
padding:15px;
}

.row{
display:flex;
justify-content:space-between;
border:2px solid gold;
padding:10px;
margin:8px;
border-radius:10px;
}

.k{color:gold;font-size:24px;width:20%;}
.r{color:#00ffcc;width:30%;text-align:center;}
.m{width:50%;text-align:center;}
</style>
</head>

<body>

<h2 style="text-align:center;color:gold;">JLPT N5 Kanji (120 FULL SYSTEM)</h2>

<div id="list"></div>

<script src="n5-data.js"></script>

<script>
let box = document.getElementById("list");

kanjiN5.forEach(k=>{
box.innerHTML += `
<div class="row">
<div class="k">${k.kanji}</div>
<div class="r">${k.romaji}</div>
<div class="m">${k.meaning}</div>
</div>`;
});

console.log("Rendered:", kanjiN5.length);
</script>

</body>
</html>
