<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>JLPT N5 Kanji</title>

<style>

/* =========================
   GLOBAL FIX (NO FREEZE)
========================= */
html, body{
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
    background:#0b0b0b;
    color:white;

    overflow-y:auto;
    overflow-x:hidden;
    touch-action:pan-y;
}

/* TITLE */
.title{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    color:gold;
    padding:15px;
}

/* SEARCH BOX */
#searchBox{
    width:90%;
    display:block;
    margin:10px auto;
    padding:10px;

    border:2px solid gold;
    border-radius:10px;

    background:#111;
    color:white;
    outline:none;
}

/* CONTAINER */
.container{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;

    min-height:100vh;
    padding-bottom:40px;
}

/* ROW (KANJI CARD) */
.row{
    width:90%;
    border:2px solid gold;
    border-radius:12px;

    padding:12px;
    margin:8px 0;

    background:rgba(255,255,255,0.05);
    text-align:center;
}

/* KANJI */
.kanji{
    font-size:32px;
    color:gold;
    font-weight:bold;
}

/* HIRAGANA */
.kana{
    font-size:12px;
    color:#aaa;
    margin-top:3px;
}

/* ROMAJI */
.romaji{
    font-size:13px;
    color:#00ffcc;
    margin-top:5px;
}

/* SINHALA */
.meaning{
    font-size:13px;
    color:white;
    margin-top:5px;
}

</style>
</head>

<body>

<div class="title">JLPT N5 KANJI (120 SYSTEM)</div>

<!-- SEARCH -->
<input id="searchBox" placeholder="Search Kanji..." />

<div class="container" id="list"></div>

<script src="n5-data.js"></script>

<script>

let box = document.getElementById("list");

/* RENDER KANJI */
kanjiN5.forEach(k=>{
    box.innerHTML += `
    <div class="row">

        <div class="kanji">${k.kanji}</div>
        <div class="kana">${k.kana}</div>
        <div class="romaji">${k.romaji}</div>
        <div class="meaning">${k.meaning}</div>

    </div>`;
});

/* SEARCH FUNCTION */
document.getElementById("searchBox").addEventListener("keyup", function(){

let value = this.value.toLowerCase();
let cards = document.querySelectorAll(".row");

cards.forEach(card=>{
    let text = card.innerText.toLowerCase();

    if(text.includes(value)){
        card.style.display="block";
    } else {
        card.style.display="none";
    }
});

});

</script>

</body>
</html>
