<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JLPT N5 Kanji</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0b0b0b;
    color:white;
    padding:15px;
}

/* TITLE */
.title{
    text-align:center;
    font-size:24px;
    color:gold;
    font-weight:bold;
    margin-bottom:15px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:10px;
}

/* CARD */
.card{
    border:2px solid gold;
    border-radius:12px;
    padding:12px;
    background:rgba(255,255,255,0.05);
    text-align:center;
}

/* KANJI */
.kanji{
    font-size:30px;
    color:gold;
    font-weight:bold;
}

/* MEANING */
.meaning{
    font-size:12px;
    margin-top:5px;
    color:white;
}

/* READING */
.reading{
    font-size:11px;
    color:#aaa;
    margin-top:3px;
}

/* BACK BUTTON */
.back{
    display:block;
    text-align:center;
    margin-bottom:15px;
    color:black;
    background:gold;
    padding:10px;
    border-radius:10px;
    font-weight:bold;
    text-decoration:none;
}

</style>
</head>

<body>

<a class="back" href="kanji.html">⬅ Back</a>

<div class="title">
JLPT N5 KANJI
</div>

<div class="grid">

    <div class="card">
        <div class="kanji">日</div>
        <div class="meaning">Day / Sun</div>
        <div class="reading">にち / ひ</div>
    </div>

    <div class="card">
        <div class="kanji">月</div>
        <div class="meaning">Moon / Month</div>
        <div class="reading">げつ / つき</div>
    </div>

    <div class="card">
        <div class="kanji">人</div>
        <div class="meaning">Person</div>
        <div class="reading">ひと / じん</div>
    </div>

    <div class="card">
        <div class="kanji">山</div>
        <div class="meaning">Mountain</div>
        <div class="reading">やま</div>
    </div>

    <div class="card">
        <div class="kanji">川</div>
        <div class="meaning">River</div>
        <div class="reading">かわ</div>
    </div>

    <div class="card">
        <div class="kanji">水</div>
        <div class="meaning">Water</div>
        <div class="reading">みず</div>
    </div>

    <div class="card">
        <div class="kanji">火</div>
        <div class="meaning">Fire</div>
        <div class="reading">ひ</div>
    </div>

    <div class="card">
        <div class="kanji">木</div>
        <div class="meaning">Tree</div>
        <div class="reading">き</div>
    </div>

</div>

</body>
</html>
