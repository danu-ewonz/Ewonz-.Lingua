<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT N5 Kanji</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0b0b0b;
    color:white;
    overflow-x:hidden;
}

.header{
    text-align:center;
    padding:20px;
    font-size:26px;
    font-weight:bold;
    color:#ffd700;
    letter-spacing:3px;
    border-bottom:2px solid #ffd700;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:12px;
    padding:15px;
}

.card{
    background:#111;
    border:2px solid #ffd700;
    border-radius:12px;
    padding:14px 10px;
    text-align:center;
    box-shadow:0 0 10px rgba(255,215,0,0.12);
    transition:0.2s;
}

.card:active{ transform:scale(0.96); }

.kanji{ font-size:42px; font-weight:bold; color:white; }
.en{ margin-top:6px; font-size:12px; color:white; }
.si{ margin-top:3px; font-size:13px; color:#ffd700; font-weight:bold; }
.hira{ margin-top:4px; font-size:12px; color:#ccc; }
.roma{ margin-top:2px; font-size:11px; color:#aaa; font-style:italic; }

.container{ padding-bottom:80px; }
</style>
</head>

<body>

<div class="header">JLPT - N5 KANJI</div>

<div class="container">
<div id="grid" class="grid"></div>
</div>

<script>
const kanjiList = [
    {k:"一", en:"One", si:"එක", h:"いち", r:"ichi"},
    {k:"二", en:"Two", si:"දෙක", h:"に", r:"ni"},
    {k:"三", en:"Three", si:"තුන", h:"さん", r:"san"},
    {k:"四", en:"Four", si:"හතර", h:"よん", r:"yon"},
    {k:"五", en:"Five", si:"පහ", h:"ご", r:"go"},
    {k:"六", en:"Six", si:"හය", h:"ろく", r:"roku"},
    {k:"七", en:"Seven", si:"හත", h:"なな", r:"nana"},
    {k:"八", en:"Eight", si:"අට", h:"はち", r:"hachi"},
    {k:"九", en:"Nine", si:"නවය", h:"きゅう", r:"kyuu"},
    {k:"十", en:"Ten", si:"දහය", h:"じゅう", r:"juu"},

    {k:"日", en:"Day", si:"දින", h:"にち", r:"nichi"},
    {k:"月", en:"Moon/Month", si:"සඳ/මාසය", h:"げつ", r:"getsu"},
    {k:"火", en:"Fire", si:"ගිනි", h:"か", r:"ka"},
    {k:"水", en:"Water", si:"ජලය", h:"すい", r:"sui"},
    {k:"木", en:"Tree", si:"ගස", h:"もく", r:"moku"},

    {k:"人", en:"Person", si:"පුද්ගලයා", h:"ひと", r:"hito"},
    {k:"目", en:"Eye", si:"ඇස", h:"め", r:"me"}
];

const grid=document.getElementById("grid");

kanjiList.forEach(i=>{
    const c=document.createElement("div");
    c.className="card";
    c.innerHTML=`
        <div class="kanji">${i.k}</div>
        <div class="en">${i.en}</div>
        <div class="si">${i.si}</div>
        <div class="hira">${i.h}</div>
        <div class="roma">${i.r}</div>
    `;
    grid.appendChild(c);
});
</script>

</body>
</html>
