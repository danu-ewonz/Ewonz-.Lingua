<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>N5 Kanji 2 Column</title>

<style>

/* GLOBAL FIX */
html, body{
    margin:0;
    padding:0;
    background:#0b0b0b;
    font-family:Arial, sans-serif;
    color:white;

    overflow-y:auto;
    overflow-x:hidden;
    touch-action:pan-y;

    padding-bottom:70px; /* for bottom nav */
}

/* TITLE */
.title{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    color:gold;
    padding:15px;
}

/* SEARCH */
#searchBox{
    width:90%;
    display:block;
    margin:10px auto;
    padding:10px;

    border:2px solid gold;
    border-radius:10px;

    background:#111;
    color:white;
    outline:none;
}

/* LIST WRAPPER */
.container{
    padding:10px;
}

/* ROW */
.row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

/* CARD */
.card{
    flex:1;
    border:2px solid gold;
    border-radius:12px;

    padding:10px;
    background:rgba(255,255,255,0.05);

    text-align:center;
}

/* KANJI */
.kanji{
    font-size:30px;
    color:gold;
    font-weight:bold;
}

/* HIRAGANA */
.kana{
    font-size:11px;
    color:#aaa;
    margin-top:3px;
}

/* ROMAJI */
.romaji{
    font-size:12px;
    color:#00ffcc;
    margin-top:5px;
}

/* SINHALA */
.meaning{
    font-size:12px;
    color:white;
    margin-top:5px;
}

/* 🔥 HIGHLIGHT (SEARCH) */
.highlight{
    background:gold;
    color:black;
    padding:2px;
    border-radius:4px;
}

/* =========================
   BOTTOM NAV (PHONE STYLE)
========================= */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;

    width:100%;
    display:flex;

    background:rgba(0,0,0,0.95);
    border-top:2px solid gold;

    padding:8px 0;
}

.nav-btn{
    flex:1;
    padding:10px;

    border:none;
    font-size:14px;
    font-weight:bold;

    background:transparent;
}

.nav-btn.back{
    color:#e74c3c;
}

.nav-btn.home{
    color:gold;
}

</style>
</head>

<body>

<div class="title">JLPT N5 Kanji (2 Column List)</div>

<input id="searchBox" placeholder="Search Kanji..." />

<div class="container" id="list"></div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">

    <button class="nav-btn back" onclick="history.back()">
        ⬅ Back
    </button>

    <button class="nav-btn home" onclick="location.href='index.html'">
        🏠 Home
    </button>

</div>

<script src="n5-data.js"></script>

<script>

let box = document.getElementById("list");

/* RENDER */
function render(data){

box.innerHTML = "";

for(let i=0; i<data.length; i+=2){

let k1 = data[i];
let k2 = data[i+1];

box.innerHTML += `
<div class="row">

<div class="card">
<div class="kanji">${k1?.kanji || ""}</div>
<div class="kana">${k1?.kana || ""}</div>
<div class="romaji">${k1?.romaji || ""}</div>
<div class="meaning">${k1?.meaning || ""}</div>
</div>

<div class="card">
<div class="kanji">${k2?.kanji || ""}</div>
<div class="kana">${k2?.kana || ""}</div>
<div class="romaji">${k2?.romaji || ""}</div>
<div class="meaning">${k2?.meaning || ""}</div>
</div>

</div>`;
}

}

render(kanjiN5);

/* SEARCH + HIGHLIGHT */
document.getElementById("searchBox").addEventListener("keyup", function(){

let value = this.value.toLowerCase();

if(value === ""){
    render(kanjiN5);
    return;
}

let filtered = kanjiN5.filter(k =>
    k.kanji.includes(value) ||
    k.kana.includes(value) ||
    k.romaji.toLowerCase().includes(value) ||
    k.meaning.includes(value)
);

render(filtered);

});

</script>

</body>
</html>
