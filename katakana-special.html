<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Katakana Special</title>

<style>

/* =========================
🌐 GLOBAL
========================= */
body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:radial-gradient(circle at top, #1a1a1a, #000);
    font-family:Arial, sans-serif;

    padding:20px 0;
}

/* =========================
MAIN CARD
========================= */
.container{
    width:90%;
    max-width:400px;

    background:#000;

    border:1px solid rgba(255,215,0,0.6);
    border-radius:20px;

    padding:20px;
    text-align:center;

    position:relative;

    box-shadow:0 0 20px rgba(255,215,0,0.08);
}

/* GOLD GLOW */
.container::after{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:22px;

    background:linear-gradient(45deg,#ffd700,#ffcc00,#fff3b0,#ffae00);

    z-index:-1;
    filter:blur(6px);
    opacity:0.6;
}

/* TITLE */
.title{
    color:#ffd700;
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
}

/* BUTTON */
.btn{
    width:100%;
    padding:15px;
    margin:10px 0;

    border-radius:12px;
    border:1px solid rgba(255,215,0,0.6);

    background:rgba(255,255,255,0.03);

    color:#fff;
    font-size:16px;
    font-weight:bold;

    cursor:pointer;
    transition:0.25s ease;
}

.btn:hover{
    transform:scale(1.03);
    background:rgba(255,215,0,0.9);
    color:#000;
    box-shadow:0 0 18px rgba(255,215,0,0.4);
}

/* =========================
BACK BUTTON
========================= */
.back-btn{
    position:fixed;
    top:15px;
    left:15px;

    padding:10px 14px;
    border-radius:10px;

    border:1px solid gold;
    background:rgba(255,215,0,0.1);

    color:gold;
    font-weight:bold;

    cursor:pointer;
    transition:0.2s ease;
}

.back-btn:hover{
    background:gold;
    color:#000;
}

</style>
</head>

<body>

<!-- BACK BUTTON -->
<button class="back-btn" onclick="history.back()">
⬅ Back
</button>

<div class="container">

    <div class="title">
        Katakana Special 
    </div>

    <!-- 1 -->
    <button class="btn" onclick="go('katakana-dakuten.html')">
        Dakuten - තෙන් තෙන් (゛)
    </button>

    <!-- 2 -->
    <button class="btn" onclick="go('katakana-handakuten.html')">
        Handakuten - මරු තෙන් (゜)
    </button>

    <!-- 3 -->
    <button class="btn" onclick="go('katakana-youon.html')">
        Youon - බැදි අක්ෂර (拗音)
    </button>

    <!-- 4 -->
    <button class="btn" onclick="go('katakana-chouon.html')">
        Chouon - දිර්ඝ අක්ෂර (長音)
    </button>

</div>

<script>
function go(page){
    window.location.href = page;
}
</script>

</body>
</html>
