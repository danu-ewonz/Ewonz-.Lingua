<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Question Words</title>

<style>

body{
    margin:0;
    background:#0b0b0b;
    font-family:Arial;
    padding:20px;
    color:white;
}

.title{
    text-align:center;
    font-size:24px;
    color:gold;
    margin-bottom:20px;
}

/* ROW */
.row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

/* CARD */
.lang-card{
    flex:1;
    border:2px solid gold;
    border-radius:12px;
    padding:10px;
    background:rgba(255,255,255,0.05);
    text-align:center;
}

/* TEXT FIX */
.lang-card *{
    color:#fff;
}

/* JAPANESE */
.kanji{
    font-size:24px;
    font-weight:bold;
}

/* ROMAJI */
.romaji{
    color:#00ffcc;
    font-size:12px;
    margin-top:5px;
}

/* SINHALA */
.meaning{
    font-size:12px;
    margin-top:5px;
    color:#ffffff;
    opacity:0.9;
}

</style>
</head>

<body>

<div class="title">Question Words</div>

<!-- 1 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">何</div>
        <div class="romaji">nani</div>
        <div class="meaning">මොකක්ද</div>
    </div>

    <div class="lang-card">
        <div class="kanji">誰</div>
        <div class="romaji">dare</div>
        <div class="meaning">කවුද</div>
    </div>

</div>

<!-- 2 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">どこ</div>
        <div class="romaji">doko</div>
        <div class="meaning">කොහෙද</div>
    </div>

    <div class="lang-card">
        <div class="kanji">いつ</div>
        <div class="romaji">itsu</div>
        <div class="meaning">කවදාද</div>
    </div>

</div>

<!-- 3 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">なぜ</div>
        <div class="romaji">naze</div>
        <div class="meaning">ඇයි</div>
    </div>

    <div class="lang-card">
        <div class="kanji">どう</div>
        <div class="romaji">dou</div>
        <div class="meaning">කොහොමද</div>
    </div>

</div>

<!-- 4 -->
<div class="row">

    <div class="lang-card">
        <div class="kanji">どれ</div>
        <div class="romaji">dore</div>
        <div class="meaning">කවුරුද / කුමක්ද (choose)</div>
    </div>

    <div class="lang-card">
        <div class="kanji">いくら</div>
        <div class="romaji">ikura</div>
        <div class="meaning">කීයද (මිල)</div>
    </div>

</div>

</body>
</html>
