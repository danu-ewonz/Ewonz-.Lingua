<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katakana Handakuten</title>

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial;
padding:20px;
text-align:center;
}

h1{color:gold;}

.back-btn{
position:fixed;
top:15px;
left:15px;
padding:10px 14px;
border:1px solid gold;
background:rgba(255,215,0,0.1);
color:gold;
border-radius:10px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

td{
border:1px solid gold;
padding:15px;
font-size:22px;
}

.small{
font-size:12px;
opacity:0.7;
display:block;
}
</style>
</head>

<body>

<button class="back-btn" onclick="history.back()">⬅ Back</button>

<h1>Katakana Handakuten</h1>

<table>
<tr>
<td>パ<span class="small">pa</span></td>
<td>ピ<span class="small">pi</span></td>
<td>プ<span class="small">pu</span></td>
<td>ペ<span class="small">pe</span></td>
<td>ポ<span class="small">po</span></td>
</tr>
</table>

</body>
</html>
