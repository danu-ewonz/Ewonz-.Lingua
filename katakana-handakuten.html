<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katakana Handakuten</title>

<style>
body{
margin:0;
background:#000;
font-family:Arial;
color:#fff;
padding:20px;
text-align:center;
}

h1{
color:gold;
margin-bottom:20px;
}

/* GROUP */
.group{
margin-bottom:25px;
}

/* TITLE */
.group-title{
color:gold;
font-size:16px;
margin:10px 0;
text-align:left;
}

/* GRID (2 CARDS PER ROW) */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

/* CARD */
.card{
border:2px solid gold;
border-radius:12px;
padding:10px;
background:rgba(255,255,255,0.03);
text-align:center;
font-size:18px;
}

/* ROMAJI */
.small{
display:block;
color:#ffd700;
font-size:13px;
margin-top:5px;
}

/* RESPONSIVE */
@media(max-width:500px){
.grid{
grid-template-columns:1fr 1fr;
}
}

</style>
</head>

<body>

<h1>Katakana Handakuten</h1>

<!-- P ROW -->
<div class="group">
<div class="group-title">P-Row</div>
<div class="grid">

<div class="card">ハ → パ<span class="small">ha → pa</span></div>
<div class="card">ヒ → ピ<span class="small">hi → pi</span></div>
<div class="card">フ → プ<span class="small">fu → pu</span></div>
<div class="card">ヘ → ペ<span class="small">he → pe</span></div>
<div class="card">ホ → ポ<span class="small">ho → po</span></div>

</div>
</div>

</body>
</html>
