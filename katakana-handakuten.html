<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katakana Handakuten</title>

<style>
body{
margin:0;
background:#000;
font-family:Arial;
color:#fff;

/* 🔥 FIX: full screen feel */
min-height:100vh;
padding:20px;
box-sizing:border-box;
}

h1{
color:gold;
text-align:center;
margin-bottom:20px;
}

/* 🔥 FULL WIDTH CHART */
.chart{
width:100%;
max-width:500px;
margin:0 auto;

border:2px solid gold;
border-radius:12px;
overflow:hidden;

background:rgba(255,255,255,0.03);
}

/* ROW */
.row{
padding:15px;
border-bottom:1px solid rgba(255,215,0,0.3);
font-size:18px;
line-height:1.8;
}

.row:last-child{
border-bottom:none;
}

/* ROMAJI */
.small{
color:#ffd700;
font-size:14px;
}

/* 🔥 TITLE spacing fix */
h1{
margin-top:10px;
}

</style>
</head>

<body>

<h1>Katakana Handakuten</h1>

<div class="chart">

<div class="row">ハ → パ <span class="small">(ha → pa)</span></div>
<div class="row">ヒ → ピ <span class="small">(hi → pi)</span></div>
<div class="row">フ → プ <span class="small">(fu → pu)</span></div>
<div class="row">ヘ → ペ <span class="small">(he → pe)</span></div>
<div class="row">ホ → ポ <span class="small">(ho → po)</span></div>

</div>

</body>
</html>
