<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katakana Handakuten Chart</title>

<style>
body{
margin:0;
background:#000;
font-family:Arial;
color:#fff;
padding:20px;
text-align:center;
}

h1{
color:gold;
margin-bottom:20px;
}

/* BOX */
.chart{
border:2px solid gold;
border-radius:12px;
overflow:hidden;
}

/* ROW */
.row{
padding:15px;
border-bottom:1px solid gold;
font-size:20px;
}

.row:last-child{
border-bottom:none;
}

/* ROMAJI */
.small{
display:block;
font-size:12px;
opacity:0.7;
margin-top:5px;
}

</style>
</head>

<body>

<h1>Katakana Handakuten</h1>

<div class="chart">

<div class="row">
ハ → パ <span class="small">ha → pa</span>
</div>

<div class="row">
ヒ → ピ <span class="small">hi → pi</span>
</div>

<div class="row">
フ → プ <span class="small">fu → pu</span>
</div>

<div class="row">
ヘ → ペ <span class="small">he → pe</span>
</div>

<div class="row">
ホ → ポ <span class="small">ho → po</span>
</div>

</div>

</body>
</html>
