<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Youon (ャュョ) - Katakana</title>

<style>

body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#0b0b0b;
    font-family:Arial;
    padding:20px;
}

/* CARD */
.container{
    width:95%;
    max-width:500px;

    border:2px solid gold;
    border-radius:20px;

    padding:20px;
    text-align:center;

    background:rgba(255,255,255,0.03);
}

/* TITLE */
.title{
    color:gold;
    font-size:22px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    color:#aaa;
    font-size:13px;
    margin-bottom:20px;
}

/* ROW */
.row{
    display:flex;
    gap:10px;
    margin-bottom:12px;
}

/* BOX */
.box{
    flex:1;

    border:2px solid gold;
    border-radius:12px;

    padding:12px;

    background:rgba(255,255,255,0.05);
}

/* BIG */
.big{
    font-size:26px;
    color:white;
    font-weight:bold;
}

/* SMALL */
.small{
    font-size:12px;
    color:#aaa;
    margin-top:5px;
}

/* SECTION */
.section{
    color:gold;
    font-size:14px;
    font-weight:bold;
    margin:15px 0 8px;
}

/* BACK BUTTON */
.back-btn{
    margin-top:20px;
    width:100%;
    padding:12px;

    border:2px solid gold;
    border-radius:12px;

    background:transparent;
    color:white;

    font-weight:bold;
}

.back-btn:active{
    transform:scale(0.97);
}

</style>
</head>

<body>

<div class="container">

    <div class="title">Youon (ャュョ)</div>
    <div class="subtitle">Small Y combination sounds</div>

    <div class="section">K-group</div>
    <div class="row">
        <div class="box"><div class="big">キャ</div><div class="small">kya</div></div>
        <div class="box"><div class="big">キュ</div><div class="small">kyu</div></div>
        <div class="box"><div class="big">キョ</div><div class="small">kyo</div></div>
    </div>

    <div class="section">S-group</div>
    <div class="row">
        <div class="box"><div class="big">シャ</div><div class="small">sha</div></div>
        <div class="box"><div class="big">シュ</div><div class="small">shu</div></div>
        <div class="box"><div class="big">ショ</div><div class="small">sho</div></div>
    </div>

    <div class="section">T-group</div>
    <div class="row">
        <div class="box"><div class="big">チャ</div><div class="small">cha</div></div>
        <div class="box"><div class="big">チュ</div><div class="small">chu</div></div>
        <div class="box"><div class="big">チョ</div><div class="small">cho</div></div>
    </div>

    <div class="section">N-group</div>
    <div class="row">
        <div class="box"><div class="big">ニャ</div><div class="small">nya</div></div>
        <div class="box"><div class="big">ニュ</div><div class="small">nyu</div></div>
        <div class="box"><div class="big">ニョ</div><div class="small">nyo</div></div>
    </div>

    <div class="section">H-group</div>
    <div class="row">
        <div class="box"><div class="big">ヒャ</div><div class="small">hya</div></div>
        <div class="box"><div class="big">ヒュ</div><div class="small">hyu</div></div>
        <div class="box"><div class="big">ヒョ</div><div class="small">hyo</div></div>
    </div>

    <div class="section">M-group</div>
    <div class="row">
        <div class="box"><div class="big">ミャ</div><div class="small">mya</div></div>
        <div class="box"><div class="big">ミュ</div><div class="small">myu</div></div>
        <div class="box"><div class="big">ミョ</div><div class="small">myo</div></div>
    </div>

    <div class="section">R-group</div>
    <div class="row">
        <div class="box"><div class="big">リャ</div><div class="small">rya</div></div>
        <div class="box"><div class="big">リュ</div><div class="small">ryu</div></div>
        <div class="box"><div class="big">リョ</div><div class="small">ryo</div></div>
    </div>

</div>

</body>
</html>
