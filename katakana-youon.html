<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katakana Youon Chart</title>

<style>
body{
margin:0;
background:#000;
font-family:Arial;
color:#fff;
padding:20px;
text-align:center;
}

h1{
color:gold;
margin-bottom:20px;
}

/* BOX */
.chart{
border:2px solid gold;
border-radius:12px;
overflow:hidden;
}

/* ROW */
.row{
padding:15px;
border-bottom:1px solid gold;
font-size:18px;
line-height:1.6;
}

.row:last-child{
border-bottom:none;
}

/* ROMAJI SMALL */
.small{
display:block;
font-size:12px;
opacity:0.7;
margin-top:5px;
}

/* EXAMPLE STYLE */
.example{
display:block;
font-size:13px;
opacity:0.85;
margin-top:5px;
color:#ffd700;
}

</style>
</head>

<body>

<h1>Katakana Youon</h1>

<div class="chart">

<div class="row">
キャ - kya
<span class="example">キャット → kyatto</span>
</div>

<div class="row">
シュ - shu
<span class="example">ショップ → shoppu</span>
</div>

<div class="row">
チョ - cho
<span class="example">チョコ → choko</span>
</div>

<div class="row">
ニャ - nya
<span class="example">ニャン → nyan</span>
</div>

<div class="row">
ヒャ - hya
<span class="example">ヒャク → hyaku</span>
</div>

</div>

</body>
</html>
