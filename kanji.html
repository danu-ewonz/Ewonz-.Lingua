<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kanji System</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0b0b0b;
    color:white;
    padding:20px;
}

/* TITLE */
.main-title{
    text-align:center;
    color:gold;
    font-size:26px;
    font-weight:bold;
    margin-bottom:5px;
}

/* SUB TITLE */
.sub-title{
    text-align:center;
    font-size:12px;
    color:#aaa;
    margin-bottom:20px;
}

/* SECTION BOX */
.section{
    border:2px solid gold;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    background:rgba(255,255,255,0.05);
}

/* SECTION TITLE */
.section-title{
    font-weight:bold;
    margin-bottom:10px;
}

/* KANJI BIG TITLE STYLE */
.kanji-main{
    font-size:28px;
    color:gold;
    font-weight:bold;
}

/* SMALL NOTE */
.note{
    font-size:11px;
    color:#aaa;
    margin-top:3px;
    margin-bottom:10px;
}

/* BUTTONS */
.btn{
    display:block;
    width:100%;
    margin:6px 0;

    padding:10px;

    border:2px solid gold;
    border-radius:10px;

    background:transparent;
    color:white;

    font-weight:bold;
    cursor:pointer;
}

.btn:hover{
    background:rgba(255,215,0,0.1);
}

</style>
</head>

<body>

<div class="main-title">
KANJI
</div>

<div class="sub-title">
Japanese Exam Required Kanji
</div>

<!-- 1 JLPT -->
<div class="section">

    <div class="section-title">
        (1) JLPT EXAM
    </div>

    <button class="btn">JLPT - N5</button>
    <button class="btn">JLPT - N4</button>
    <button class="btn">JLPT - N3</button>
    <button class="btn">JLPT - N2</button>
    <button class="btn">JLPT - N1</button>

</div>

<!-- 2 NAT -->
<div class="section">

    <div class="section-title">
        (2) NAT - TEST
    </div>

    <button class="btn">5Q</button>
    <button class="btn">4Q</button>
    <button class="btn">3Q</button>
    <button class="btn">2Q</button>
    <button class="btn">1Q</button>

</div>

<!-- 3 JFT -->
<div class="section">

    <div class="section-title">
        (3) JFT BASIC (SSW)
    </div>

    <button class="btn">JFT (N2)</button>

</div>

</body>
</html>
