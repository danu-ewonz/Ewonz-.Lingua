<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanji System</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b0b0b;
    color:white;
}

.header{
    text-align:center;
    padding:20px;
    font-size:24px;
    color:#ffd700;
    border-bottom:2px solid #ffd700;
}

.section-title{
    margin:15px;
    padding-left:10px;
    border-left:4px solid #ffd700;
    color:#ffd700;
    font-weight:bold;
}

.level-box{
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.level-btn{
    padding:14px;
    background:#111;
    border:2px solid #ffd700;
    color:white;
    text-align:center;
    border-radius:12px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="header">KANJI - JAPANESE EXAM</div>

<!-- JLPT -->
<div class="section-title">JLPT - EXAM</div>
<div class="level-box">
    <div class="level-btn" onclick="location.href='./n5.html'">JLPT - N5</div>
    <div class="level-btn" onclick="location.href='./n4.html'">JLPT - N4</div>
    <div class="level-btn" onclick="location.href='./n3.html'">JLPT - N3</div>
    <div class="level-btn" onclick="location.href='./n2.html'">JLPT - N2</div>
    <div class="level-btn" onclick="location.href='./n1.html'">JLPT - N1</div>
</div>

<!-- NAT -->
<div class="section-title">NAT - TEST</div>
<div class="level-box">
    <div class="level-btn" onclick="location.href='./nat-q5.html'">Q5</div>
    <div class="level-btn" onclick="location.href='./nat-q4.html'">Q4</div>
    <div class="level-btn" onclick="location.href='./nat-q3.html'">Q3</div>
    <div class="level-btn" onclick="location.href='./nat-q2.html'">Q2</div>
    <div class="level-btn" onclick="location.href='./nat-q1.html'">Q1</div>
</div>

<!-- JFT -->
<div class="section-title">JFT - BASIC</div>
<div class="level-box">
    <div class="level-btn" onclick="location.href='./jft-basic.html'">JFT BASIC</div>
</div>

</body>
</html>
