<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT Kanji Hub</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0b0b0b;
    color:white;
}

/* HEADER */
.header{
    text-align:center;
    padding:20px;
    font-size:28px;
    font-weight:bold;
    color:#ffd700;
    border-bottom:2px solid #ffd700;
    letter-spacing:2px;
}

/* GRID MENU */
.menu{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:15px;
    padding:20px;
}

/* BUTTON CARD */
.btn{
    background:#111;
    border:2px solid #ffd700;
    border-radius:14px;
    padding:25px 10px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    color:white;
    transition:0.2s;
    box-shadow:0 0 10px rgba(255,215,0,0.12);
    cursor:pointer;
}

.btn:active{
    transform:scale(0.96);
}

/* SUB TEXT */
.sub{
    font-size:12px;
    color:#ccc;
    margin-top:6px;
}
</style>
</head>

<body>

<div class="header">JLPT KANJI SYSTEM</div>

<div class="menu">

    <!-- JLPT LEVELS -->
    <div class="btn" onclick="location.href='n5.html'">
        N5 KANJI
        <div class="sub">Beginner Level</div>
    </div>

    <div class="btn" onclick="location.href='n4.html'">
        N4 KANJI
        <div class="sub">Basic Level</div>
    </div>

    <!-- EXAMS -->
    <div class="btn" onclick="alert('Coming Soon')">
        JLPT EXAMS
        <div class="sub">Practice Tests</div>
    </div>

    <div class="btn" onclick="alert('Coming Soon')">
        JFT BASIC
        <div class="sub">Exam Practice</div>
    </div>

</div>

</body>
</html>
