<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT Kanji System</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0b0b0b;
    color:white;
}

/* HEADER */
.header{
    text-align:center;
    padding:18px;
    font-size:26px;
    font-weight:bold;
    color:#ffd700;
    border-bottom:2px solid #ffd700;
    letter-spacing:2px;
}

/* SEARCH */
.search-box{
    padding:10px;
    text-align:center;
}

.search-box input{
    width:92%;
    padding:12px;
    border-radius:10px;
    border:2px solid #ffd700;
    background:#111;
    color:white;
    font-size:14px;
    outline:none;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:12px;
    padding:15px;
}

/* CARD */
.card{
    background:#111;
    border:2px solid #ffd700;
    border-radius:12px;
    padding:14px 10px;
    text-align:center;
    box-shadow:0 0 10px rgba(255,215,0,0.12);
    transition:0.2s;
}

.card:active{
    transform:scale(0.96);
}

/* TEXT STYLES */
.kanji{
    font-size:42px;
    font-weight:bold;
    color:white;
}

.en{
    margin-top:6px;
    font-size:12px;
    color:white;
}

.si{
    margin-top:3px;
    font-size:13px;
    color:#ffd700;
    font-weight:bold;
}

.hira{
    margin-top:4px;
    font-size:12px;
    color:#ccc;
}

.roma{
    margin-top:2px;
    font-size:11px;
    color:#aaa;
    font-style:italic;
}

.container{
    padding-bottom:80px;
}
</style>
</head>

<body>

<div class="header">JLPT KANJI</div>

<div class="search-box">
<input type="text" id="search" placeholder="Search kanji / English / Sinhala / Hiragana / Romaji...">
</div>

<div class="container">
<div id="grid" class="grid"></div>
</div>

<script>

/* 🔥 CHANGE ONLY THIS LIST FOR N5 / N4 */

const kanjiList = [
    // N5 + N4 sample mix (replace as needed)

    {k:"一", en:"One", si:"එක", h:"いち", r:"ichi"},
    {k:"二", en:"Two", si:"දෙක", h:"に", r:"ni"},
    {k:"三", en:"Three", si:"තුන", h:"さん", r:"san"},
    {k:"四", en:"Four", si:"හතර", h:"よん", r:"yon"},
    {k:"五", en:"Five", si:"පහ", h:"ご", r:"go"},

    {k:"日", en:"Day", si:"දින", h:"にち", r:"nichi"},
    {k:"月", en:"Month / Moon", si:"සඳ / මාසය", h:"げつ", r:"getsu"},
    {k:"水", en:"Water", si:"ජලය", h:"すい", r:"sui"},
    {k:"火", en:"Fire", si:"ගිනි", h:"か", r:"ka"},

    {k:"会", en:"Meet", si:"හමුවීම", h:"かい", r:"kai"},
    {k:"同", en:"Same", si:"එකම", h:"どう", r:"dou"},
    {k:"事", en:"Thing", si:"දේ", h:"こと", r:"koto"},
    {k:"人", en:"Person", si:"පුද්ගලයා", h:"ひと", r:"hito"},
    {k:"国", en:"Country", si:"රට", h:"こく", r:"koku"}
];

const grid = document.getElementById("grid");
const search = document.getElementById("search");

/* RENDER FUNCTION */
function render(list){
    grid.innerHTML = "";

    list.forEach(i=>{
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div class="kanji">${i.k}</div>
            <div class="en">${i.en}</div>
            <div class="si">${i.si}</div>
            <div class="hira">${i.h}</div>
            <div class="roma">${i.r}</div>
        `;

        grid.appendChild(card);
    });
}

/* INITIAL LOAD */
render(kanjiList);

/* SEARCH ENGINE */
search.addEventListener("input", function(){
    let val = this.value.toLowerCase();

    let filtered = kanjiList.filter(i =>
        i.k.includes(val) ||
        i.en.toLowerCase().includes(val) ||
        i.si.includes(val) ||
        i.h.includes(val) ||
        i.r.toLowerCase().includes(val)
    );

    render(filtered);
});
</script>

</body>
</html>
