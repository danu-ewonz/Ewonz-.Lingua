<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanji - Japanese Exam Required</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0b0b0b;
    color:white;
    padding-bottom:120px; /* space for bottom */
}

/* HEADER */
.header{
    text-align:center;
    padding:20px;
    font-size:24px;
    font-weight:bold;
    color:#ffd700;
    border-bottom:2px solid #ffd700;
}

/* SECTION TITLE */
.section-title{
    padding:15px;
    font-size:18px;
    font-weight:bold;
    color:#ffd700;
    border-left:4px solid #ffd700;
    margin:15px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:12px;
    padding:15px;
}

/* BUTTON */
.btn{
    background:#111;
    border:2px solid #ffd700;
    border-radius:14px;
    padding:18px 10px;
    text-align:center;
    font-size:16px;
    font-weight:bold;
    color:white;
    box-shadow:0 0 10px rgba(255,215,0,0.12);
    cursor:pointer;
    transition:0.2s;
}

.btn:active{
    transform:scale(0.96);
}

.sub{
    font-size:11px;
    color:#ccc;
    margin-top:5px;
}

/* 🔥 BOTTOM FIXED MENU */
.bottom-menu{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#0b0b0b;
    border-top:2px solid #ffd700;
    padding:10px;
}

.bottom-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
}

.bottom-btn{
    background:#111;
    border:1px solid #ffd700;
    border-radius:10px;
    padding:10px;
    text-align:center;
    font-size:12px;
    color:white;
}
</style>
</head>

<body>

<div class="header">KANJI - JAPANESE EXAM REQUIRED</div>

<!-- CONTENT AREA -->
<div class="section-title">JLPT EXAM INFO</div>
<div style="padding:15px; font-size:13px; color:#ccc;">
Select your exam level from the bottom menu. Each level contains kanji practice sets.
</div>

<div class="section-title">NAT & JFT INFO</div>
<div style="padding:15px; font-size:13px; color:#ccc;">
NAT and JFT exams are for working visa and skill programs (SSW).
</div>

<!-- 🔥 BOTTOM BUTTONS -->
<div class="bottom-menu">
    <div class="bottom-grid">

        <div class="bottom-btn" onclick="location.href='jlpt.html'">JLPT</div>
        <div class="bottom-btn" onclick="location.href='nat.html'">NAT</div>
        <div class="bottom-btn" onclick="location.href='jft.html'">JFT</div>

        <div class="bottom-btn" onclick="location.href='jlpt-n5.html'">N5</div>
        <div class="bottom-btn" onclick="location.href='jlpt-n4.html'">N4</div>
        <div class="bottom-btn" onclick="location.href='jlpt-n3.html'">N3</div>

        <div class="bottom-btn" onclick="location.href='jlpt-n2.html'">N2</div>
        <div class="bottom-btn" onclick="location.href='jlpt-n1.html'">N1</div>
        <div class="bottom-btn" onclick="location.href='nat-q5.html'">Q5</div>

    </div>
</div>
